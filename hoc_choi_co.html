<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kỳ Đạo Học Viện</title>
<style>
  :root {
    --bg: #f6f3ec;
    --bg-elev: #ffffff;
    --bg-soft: #efeae0;
    --border: #ddd4c3;
    --text: #1f1b16;
    --text-muted: #655b4e;
    --accent: #a63429;
    --accent-hover: #8a281e;
    --accent-soft: #f9e9e7;
    --chess-accent: #2c5282;
    --chess-soft: #ebf3fc;
    --go-accent: #276749;
    --go-soft: #e6f4ec;
    --gold: #b7791f;
    --gold-soft: #fef6e4;
    --success: #1e7e4c;
    --success-soft: #e5f6ec;
    --danger: #c53030;
    --danger-soft: #fdeaea;
    --shadow-sm: 0 2px 6px rgba(31, 27, 22, 0.06);
    --shadow-md: 0 8px 24px rgba(31, 27, 22, 0.11);
    --radius: 14px;
    --radius-sm: 9px;
    --nav-h: 64px;
  }

  body.dark {
    --bg: #151412;
    --bg-elev: #201e1b;
    --bg-soft: #2a2723;
    --border: #3a352e;
    --text: #f2ece1;
    --text-muted: #aba193;
    --accent: #e05a4d;
    --accent-hover: #f06d60;
    --accent-soft: #3a211e;
    --chess-accent: #63a4ff;
    --chess-soft: #1b2a3d;
    --go-accent: #52c48c;
    --go-soft: #193125;
    --gold: #eab308;
    --gold-soft: #332a14;
    --success: #48bb78;
    --success-soft: #193324;
    --danger: #fc8181;
    --danger-soft: #3b1c1c;
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.32);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.48);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    transition: background 0.2s ease, color 0.2s ease;
    overflow-x: hidden;
  }

  button { font-family: inherit; user-select: none; }

  /* Header */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .topbar-inner {
    max-width: 1380px;
    margin: 0 auto;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.08rem;
    letter-spacing: -0.02em;
  }
  .brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #a63429, #d97706);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 1.15rem;
    box-shadow: 0 3px 10px rgba(166, 52, 41, 0.3);
    flex-shrink: 0;
  }
  .brand-sub {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0;
  }

  .game-tabs {
    display: flex;
    gap: 6px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .game-tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-weight: 700;
    font-size: 0.89rem;
    padding: 8px 15px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab.active[data-game="xiangqi"] {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(166, 52, 41, 0.35);
  }
  .game-tab.active[data-game="chess"] {
    background: var(--chess-accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(44, 82, 130, 0.35);
  }
  .game-tab.active[data-game="go"] {
    background: var(--go-accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(39, 103, 73, 0.35);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    border-radius: 9px;
    padding: 7px 11px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 36px;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--text-muted); }
  .mobile-progress-pill {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text);
  }

  /* Main Container */
  .app-shell {
    max-width: 1380px;
    margin: 0 auto;
    padding: 16px 18px 28px;
  }

  /* Mode Navigation Bar (Desktop) */
  .mode-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .mode-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mode-pill {
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    padding: 9px 15px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.87rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.16s ease;
  }
  .mode-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .mode-pill.active {
    background: var(--text);
    color: var(--bg-elev);
    border-color: var(--text);
  }

  .progress-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  .progress-bar-mini {
    width: 78px;
    height: 7px;
    background: var(--bg-soft);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-mini > span {
    display: block;
    height: 100%;
    background: var(--success);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* Two-Column Workspace */
  .workspace {
    display: grid;
    grid-template-columns: minmax(340px, 560px) minmax(340px, 1fr);
    gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  /* Board Column */
  .board-card {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    scroll-margin-top: 105px;
  }
  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .board-title {
    font-weight: 800;
    font-size: 0.98rem;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .board-header-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .board-quick-nav {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 4px;
  }
  .quick-btn {
    border: none;
    background: transparent;
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .quick-btn:hover:not(:disabled) { background: var(--bg-elev); }
  .quick-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .quick-counter {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--text-muted);
    padding: 0 3px;
    white-space: nowrap;
  }
  .turn-badge {
    font-size: 0.77rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .turn-badge.red, .turn-badge.white { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .turn-badge.black { color: var(--text); background: var(--bg-soft); }

  .canvas-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 8px;
    border: 1px solid var(--border);
    position: relative;
  }
  #gameBoardCanvas {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    box-shadow: var(--shadow-md);
  }

  .board-status {
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-soft);
    border-left: 4px solid var(--accent);
    font-size: 0.87rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 42px;
    overflow-wrap: anywhere;
  }
  .board-status.success { background: var(--success-soft); border-left-color: var(--success); color: var(--success); font-weight: 600; }
  .board-status.error { background: var(--danger-soft); border-left-color: var(--danger); color: var(--danger); font-weight: 600; }
  .board-status.info { background: var(--gold-soft); border-left-color: var(--gold); }

  .board-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    padding: 8px 13px;
    border-radius: var(--radius-sm);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 40px;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .btn:hover:not(:disabled) { background: var(--bg-soft); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-sm { padding: 6px 10px; min-height: 36px; font-size: 0.8rem; }

  .mobile-sb-dock {
    display: none;
    flex-direction: column;
    gap: 7px;
    padding-top: 2px;
  }
  .mobile-sb-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .mobile-sb-row::-webkit-scrollbar { display: none; }
  .mobile-sb-row .chip, .mobile-sb-row .palette-btn {
    flex-shrink: 0;
  }
  .mobile-puz-tabs {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .mob-puz-tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 10px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    min-height: 38px;
  }
  .mob-puz-tab.active {
    background: var(--bg-elev);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* Right Content Column */
  .panel-card {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: var(--text);
    color: var(--bg-elev);
    border-color: var(--text);
  }

  /* Curriculum & Lists */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    max-height: 340px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .list-item {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 11px;
    padding: 11px 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .list-item:hover { border-color: var(--text-muted); transform: translateX(2px); }
  .list-item.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .list-item-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .list-item-title {
    font-weight: 700;
    font-size: 0.91rem;
    line-height: 1.35;
  }
  .list-item-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .badge {
    font-size: 0.71rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-easy { background: #dcfce7; color: #166534; }
  .badge-med { background: #fef3c7; color: #92400e; }
  .badge-hard { background: #fee2e2; color: #991b1b; }
  .badge-master { background: #ede9fe; color: #5b21b6; }
  .badge-type { background: var(--bg-soft); color: var(--text-muted); border: 1px solid var(--border); }
  body.dark .badge-easy { background: #143622; color: #86efac; }
  body.dark .badge-med { background: #3b2d10; color: #fcd34d; }
  body.dark .badge-hard { background: #3f1818; color: #fca5a5; }
  body.dark .badge-master { background: #2c1e4a; color: #c4b5fd; }

  /* Detail Box */
  .detail-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .detail-box h3 {
    font-size: 1.02rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-box p {
    font-size: 0.89rem;
    color: var(--text);
  }
  .detail-list {
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 0.86rem;
  }
  .tip-box {
    background: var(--gold-soft);
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.84rem;
  }
  .mistake-box {
    background: var(--danger-soft);
    border: 1px solid var(--border);
    border-left: 4px solid var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.84rem;
  }
  .pro-box {
    background: var(--chess-soft);
    border: 1px solid var(--border);
    border-left: 4px solid var(--chess-accent);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.84rem;
  }

  /* Step Timeline */
  .step-timeline {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .step-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.83rem;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--bg-elev);
  }
  .step-row:hover { border-color: var(--border); }
  .step-row.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    font-weight: 600;
  }
  .step-num {
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-soft);
    display: grid;
    place-items: center;
    font-size: 0.74rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .step-row.active .step-num { background: var(--accent); color: #fff; }

  /* Piece Selector Grid */
  .piece-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 8px;
  }
  .piece-card {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .piece-card:hover { border-color: var(--text-muted); transform: translateY(-2px); }
  .piece-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .piece-symbol {
    font-size: 1.5rem;
    line-height: 1.1;
    font-weight: 800;
  }
  .piece-name {
    font-size: 0.81rem;
    font-weight: 700;
  }
  .piece-sub {
    font-size: 0.71rem;
    color: var(--text-muted);
  }

  /* Sandbox Palette */
  .palette-section-title {
    font-size: 0.77rem;
    font-weight: 700;
    color: var(--text-muted);
    margin: 4px 0 6px;
    text-transform: uppercase;
  }
  .palette-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .palette-btn {
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.83rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 38px;
  }
  .palette-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Mobile Bottom Nav */
  .mobile-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 60;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
  }
  body.dark .mobile-bottom-nav {
    background: rgba(32, 30, 27, 0.94);
  }
  .mob-nav-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px 4px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
    transition: all 0.15s ease;
  }
  .mob-nav-btn .mob-ico { font-size: 1.15rem; line-height: 1; }
  .mob-nav-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }

  /* Promotion Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.58);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 90;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    width: 100%;
    max-width: 340px;
    box-shadow: var(--shadow-md);
    text-align: center;
  }
  .modal-title { font-weight: 800; font-size: 1rem; margin-bottom: 12px; }
  .promo-grid {

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. AUDIO SYNTHESIZER & USER PREFERENCES
  // =========================================================================
  let audioCtx = null;
  let soundEnabled = true;

  function ensureAudio() {
    if (!soundEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playTone(type) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'move') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(state.game === 'go' ? 520 : 280, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.065);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'capture') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(68, now + 0.11);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.13);
    } else if (type === 'success') {
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, now + idx * 0.08);
        g.gain.setValueAtTime(0.14, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.22);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + idx * 0.08);
        o.stop(now + idx * 0.08 + 0.24);
      });
    } else if (type === 'error') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(175, now);
      osc.frequency.linearRampToValueAtTime(135, now + 0.14);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  }

  // =========================================================================
  // 2. PIECE METADATA & BOARD PRESETS
  // =========================================================================
  const XQ_LABELS = {
    rK: { char: '帥', vi: 'Tướng', color: 'r' },
    rA: { char: '仕', vi: 'Sĩ', color: 'r' },
    rE: { char: '相', vi: 'Tượng', color: 'r' },
    rH: { char: '傌', vi: 'Mã', color: 'r' },
    rR: { char: '俥', vi: 'Xe', color: 'r' },
    rC: { char: '炮', vi: 'Pháo', color: 'r' },
    rP: { char: '兵', vi: 'Tốt', color: 'r' },
    bK: { char: '將', vi: 'Tướng', color: 'b' },
    bA: { char: '士', vi: 'Sĩ', color: 'b' },
    bE: { char: '象', vi: 'Tượng', color: 'b' },
    bH: { char: '馬', vi: 'Mã', color: 'b' },
    bR: { char: '車', vi: 'Xe', color: 'b' },
    bC: { char: '砲', vi: 'Pháo', color: 'b' },
    bP: { char: '卒', vi: 'Tốt', color: 'b' }
  };

  const CHESS_LABELS = {
    wK: { char: '♔', vi: 'Vua Trắng', color: 'w' },
    wQ: { char: '♕', vi: 'Hậu Trắng', color: 'w' },
    wR: { char: '♖', vi: 'Xe Trắng', color: 'w' },
    wB: { char: '♗', vi: 'Tượng Trắng', color: 'w' },
    wN: { char: '♘', vi: 'Mã Trắng', color: 'w' },
    wP: { char: '♙', vi: 'Tốt Trắng', color: 'w' },
    bK: { char: '♚', vi: 'Vua Đen', color: 'b' },
    bQ: { char: '♛', vi: 'Hậu Đen', color: 'b' },
    bR: { char: '♜', vi: 'Xe Đen', color: 'b' },
    bB: { char: '♝', vi: 'Tượng Đen', color: 'b' },
    bN: { char: '♞', vi: 'Mã Đen', color: 'b' },
    bP: { char: '♟', vi: 'Tốt Đen', color: 'b' }
  };

  function emptyGrid(rows, cols) {
    return Array.from({ length: rows }, () => Array(cols).fill(null));
  }

  function cloneGrid(g) {
    return g.map(r => r.slice());
  }

  function xqInitialBoard() {
    const g = emptyGrid(10, 9);
    const back = ['R', 'H', 'E', 'A', 'K', 'A', 'E', 'H', 'R'];
    for (let c = 0; c < 9; c++) {
      g[0][c] = 'b' + back[c];
      g[9][c] = 'r' + back[c];
    }
    g[2][1] = 'bC'; g[2][7] = 'bC';
    g[7][1] = 'rC'; g[7][7] = 'rC';
    [0, 2, 4, 6, 8].forEach(c => { g[3][c] = 'bP'; g[6][c] = 'rP'; });
    return g;
  }

  function chessInitialBoard() {
    const g = emptyGrid(8, 8);
    const back = ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'];
    for (let c = 0; c < 8; c++) {
      g[0][c] = 'b' + back[c];
      g[1][c] = 'bP';
      g[6][c] = 'wP';
      g[7][c] = 'w' + back[c];
    }
    return g;
  }

  function makeBoard(rows, cols, placements) {
    const g = emptyGrid(rows, cols);
    placements.forEach(([r, c, p]) => { g[r][c] = p; });
    return g;
  }

  function defaultCastling() {
    return { wK: true, wQ: true, bK: true, bQ: true };
  }

  // =========================================================================
  // 3. GAME RULES & LEGAL MOVE ENGINES (FULL LEGALITY + CHECK + SPECIAL RULES)
  // =========================================================================

  // --- XIANGQI ENGINE ---
  function xqPseudoMoves(board, r, c) {
    const piece = board[r][c];
    if (!piece) return [];
    const color = piece[0], type = piece[1];
    const moves = [];
    const inBounds = (rr, cc) => rr >= 0 && rr < 10 && cc >= 0 && cc < 9;
    const isEnemyOrEmpty = (rr, cc) => !board[rr][cc] || board[rr][cc][0] !== color;

    if (type === 'K') {
      const rMin = color === 'r' ? 7 : 0, rMax = color === 'r' ? 9 : 2;
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= rMin && nr <= rMax && nc >= 3 && nc <= 5 && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
      });
    } else if (type === 'A') {
      const rMin = color === 'r' ? 7 : 0, rMax = color === 'r' ? 9 : 2;
      [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= rMin && nr <= rMax && nc >= 3 && nc <= 5 && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
      });
    } else if (type === 'E') {
      const rMin = color === 'r' ? 5 : 0, rMax = color === 'r' ? 9 : 4;
      [[-2,-2],[-2,2],[2,-2],[2,2]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        const mr = r + dr / 2, mc = c + dc / 2;
        if (nr >= rMin && nr <= rMax && nc >= 0 && nc < 9 && !board[mr][mc] && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
      });
    } else if (type === 'H') {
      [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]].forEach(([dr, dc, lr, lc]) => {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && !board[r + lr][c + lc] && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
      });
    } else if (type === 'R') {
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          if (!board[nr][nc]) moves.push([nr, nc]);
          else {
            if (board[nr][nc][0] !== color) moves.push([nr, nc]);
            break;
          }
          nr += dr; nc += dc;
        }
      });
    } else if (type === 'C') {
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
        let nr = r + dr, nc = c + dc, jumped = false;
        while (inBounds(nr, nc)) {
          if (!jumped) {
            if (!board[nr][nc]) moves.push([nr, nc]);
            else jumped = true;
          } else if (board[nr][nc]) {
            if (board[nr][nc][0] !== color) moves.push([nr, nc]);
            break;
          }
          nr += dr; nc += dc;
        }
      });
    } else if (type === 'P') {
      const fwd = color === 'r' ? -1 : 1;
      const crossed = color === 'r' ? r <= 4 : r >= 5;
      if (inBounds(r + fwd, c) && isEnemyOrEmpty(r + fwd, c)) moves.push([r + fwd, c]);
      if (crossed) {
        [-1, 1].forEach(dc => {
          if (inBounds(r, c + dc) && isEnemyOrEmpty(r, c + dc)) moves.push([r, c + dc]);
        });
      }
    }
    return moves;
  }

  function xqFindKings(board) {
    let rK = null, bK = null;
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] === 'rK') rK = [r, c];
        else if (board[r][c] === 'bK') bK = [r, c];
      }
    }
    return { rK, bK };
  }

  function xqFlyingGeneral(board) {
    const { rK, bK } = xqFindKings(board);
    if (!rK || !bK || rK[1] !== bK[1]) return false;
    for (let rr = bK[0] + 1; rr < rK[0]; rr++) {
      if (board[rr][rK[1]]) return false;
    }
    return true;
  }

  function xqInCheck(board, color) {
    if (xqFlyingGeneral(board)) return true;
    const { rK, bK } = xqFindKings(board);
    const target = color === 'r' ? rK : bK;
    if (!target) return false; // Graceful handling in piece demo without a King
    const opp = color === 'r' ? 'b' : 'r';
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] && board[r][c][0] === opp) {
          if (xqPseudoMoves(board, r, c).some(([mr, mc]) => mr === target[0] && mc === target[1])) {
            return true;
          }
        }
      }
    }
    return false;
  }

  function xqLegalMoves(board, r, c) {
    const piece = board[r][c];
    if (!piece) return [];
    const color = piece[0];
    return xqPseudoMoves(board, r, c).filter(([nr, nc]) => {
      const nb = cloneGrid(board);
      nb[nr][nc] = nb[r][c];
      nb[r][c] = null;
      return !xqInCheck(nb, color);
    });
  }

  function xqHasAnyLegal(board, color) {
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] && board[r][c][0] === color && xqLegalMoves(board, r, c).length > 0) return true;
      }
    }
    return false;
  }

  // --- CHESS ENGINE ---
  function chessPseudoMoves(board, r, c) {
    const piece = board[r][c];
    if (!piece) return [];
    const color = piece[0], type = piece[1];
    const moves = [];
    const inBounds = (rr, cc) => rr >= 0 && rr < 8 && cc >= 0 && cc < 8;
    const isEnemy = (rr, cc) => board[rr][cc] && board[rr][cc][0] !== color;
    const isEnemyOrEmpty = (rr, cc) => !board[rr][cc] || board[rr][cc][0] !== color;

    if (type === 'P') {
      const dir = color === 'w' ? -1 : 1;
      const startRow = color === 'w' ? 6 : 1;
      if (inBounds(r + dir, c) && !board[r + dir][c]) {
        moves.push([r + dir, c]);
        if (r === startRow && !board[r + dir * 2][c]) moves.push([r + dir * 2, c]);
      }
      [-1, 1].forEach(dc => {
        if (inBounds(r + dir, c + dc) && isEnemy(r + dir, c + dc)) moves.push([r + dir, c + dc]);
      });
    } else if (type === 'N') {
      [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
      });
    } else if (type === 'K') {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && isEnemyOrEmpty(nr, nc)) moves.push([nr, nc]);
        }
      }
    } else {
      const dirs = [];
      if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
      if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
      dirs.forEach(([dr, dc]) => {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          if (!board[nr][nc]) moves.push([nr, nc]);
          else {
            if (board[nr][nc][0] !== color) moves.push([nr, nc]);
            break;
          }
          nr += dr; nc += dc;
        }
      });
    }
    return moves;
  }

  function chessSquareAttacked(board, tr, tc, byColor) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (!p || p[0] !== byColor) continue;
        if (p[1] === 'P') {
          const dir = byColor === 'w' ? -1 : 1;
          if (r + dir === tr && (c - 1 === tc || c + 1 === tc)) return true;
        } else {
          if (chessPseudoMoves(board, r, c).some(([mr, mc]) => mr === tr && mc === tc)) return true;
        }
      }
    }
    return false;
  }

  function chessFindKing(board, color) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (board[r][c] === color + 'K') return [r, c];
      }
    }
    return null;
  }

  function chessInCheck(board, color) {
    const k = chessFindKing(board, color);
    if (!k) return false;
    return chessSquareAttacked(board, k[0], k[1], color === 'w' ? 'b' : 'w');
  }

  function chessLegalMoves(board, r, c, opts = null) {
    const piece = board[r][c];
    if (!piece) return [];
    const color = piece[0], type = piece[1];
    const opp = color === 'w' ? 'b' : 'w';
    const raw = chessPseudoMoves(board, r, c);

    // En Passant
    if (type === 'P' && opts && opts.enPassant) {
      const [er, ec] = opts.enPassant;
      const dir = color === 'w' ? -1 : 1;
      if (r + dir === er && Math.abs(c - ec) === 1 && !board[er][ec] && board[r][ec] === opp + 'P') {
        raw.push([er, ec]);
      }
    }

    const legal = raw.filter(([nr, nc]) => {
      const nb = cloneGrid(board);
      if (type === 'P' && opts && opts.enPassant && nr === opts.enPassant[0] && nc === opts.enPassant[1] && !board[nr][nc]) {
        nb[r][nc] = null;
      }
      nb[nr][nc] = nb[r][c];
      nb[r][c] = null;
      return !chessInCheck(nb, color);
    });

    // Castling
    if (type === 'K' && opts && opts.castling) {
      const homeRow = color === 'w' ? 7 : 0;
      if (r === homeRow && c === 4 && !chessInCheck(board, color)) {
        const kFlag = color === 'w' ? 'wK' : 'bK';
        const qFlag = color === 'w' ? 'wQ' : 'bQ';
        if (opts.castling[kFlag] && board[homeRow][7] === color + 'R' && !board[homeRow][5] && !board[homeRow][6]) {
          if (!chessSquareAttacked(board, homeRow, 5, opp) && !chessSquareAttacked(board, homeRow, 6, opp)) {
            legal.push([homeRow, 6]);
          }
        }
        if (opts.castling[qFlag] && board[homeRow][0] === color + 'R' && !board[homeRow][3] && !board[homeRow][2] && !board[homeRow][1]) {
          if (!chessSquareAttacked(board, homeRow, 3, opp) && !chessSquareAttacked(board, homeRow, 2, opp)) {
            legal.push([homeRow, 2]);
          }
        }
      }
    }
    return legal;
  }

  function chessHasAnyLegal(board, color, opts = null) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (board[r][c] && board[r][c][0] === color && chessLegalMoves(board, r, c, opts).length > 0) return true;
      }
    }
    return false;
  }

  // --- GO ENGINE (9x9 with liberties, capture, Ko, and Territory estimator) ---
  function goBoardHash(board) {
    return board.map(r => r.map(x => x || '.').join('')).join('|');
  }

  function goGetGroup(board, r, c) {
    const color = board[r][c];
    if (!color) return { stones: [], liberties: new Set() };
    const visited = new Set([r + ',' + c]);
    const stones = [];
    const liberties = new Set();
    const stack = [[r, c]];

    while (stack.length) {
      const [cr, cc] = stack.pop();
      stones.push([cr, cc]);
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
        const nr = cr + dr, nc = cc + dc;
        if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) return;
        const key = nr + ',' + nc;
        if (!board[nr][nc]) liberties.add(key);
        else if (board[nr][nc] === color && !visited.has(key)) {
          visited.add(key);
          stack.push([nr, nc]);
        }
      });
    }
    return { stones, liberties };
  }

  function goTryPlace(board, r, c, color, prevHash = null) {
    if (board[r][c]) return { ok: false, reason: 'Giao điểm này đã có quân!' };
    const next = cloneGrid(board);
    next[r][c] = color;
    const opp = color === 'B' ? 'W' : 'B';
    let captured = 0;

    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9 && next[nr][nc] === opp) {
        const grp = goGetGroup(next, nr, nc);
        if (grp.liberties.size === 0) {
          grp.stones.forEach(([sr, sc]) => { next[sr][sc] = null; captured++; });
        }
      }
    });

    const selfGrp = goGetGroup(next, r, c);
    if (selfGrp.liberties.size === 0 && captured === 0) {
      return { ok: false, reason: 'Nước đi tự sát (0 khí) không hợp lệ theo luật Cờ Vây!' };
    }
    const nextHash = goBoardHash(next);
    if (prevHash && nextHash === prevHash) {
      return { ok: false, reason: 'Phạm luật Cướp (Ko): phải đánh ở chỗ khác 1 nước trước khi ăn lại!' };
    }
    return { ok: true, board: next, captured, liberties: selfGrp.liberties.size, hash: nextHash };
  }

  function goEstimateScore(board, capturedGo) {
    const visited = new Set();
    let terrB = 0, terrW = 0;
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (board[r][c] || visited.has(r + ',' + c)) continue;
        const region = [];
        const borders = new Set();
        const stack = [[r, c]];
        visited.add(r + ',' + c);
        while (stack.length) {
          const [cr, cc] = stack.pop();
          region.push([cr, cc]);
          [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
            const nr = cr + dr, nc = cc + dc;
            if (nr < 0 || nr >= 9 || nc < 0 || nc >= 9) return;
            if (!board[nr][nc]) {
              const key = nr + ',' + nc;
              if (!visited.has(key)) { visited.add(key); stack.push([nr, nc]); }
            } else {
              borders.add(board[nr][nc]);
            }
          });
        }
        if (borders.size === 1) {
          if (borders.has('B')) terrB += region.length;
          else terrW += region.length;
        }
      }
    }
    const totalB = terrB + capturedGo.B;
    const totalW = terrW + capturedGo.W + 6.5;
    return { terrB, terrW, totalB, totalW };
  }

    const savedPrefs = localStorage.getItem('kydao_prefs_v2');
    if (savedPrefs) {
      const prefs = JSON.parse(savedPrefs);
      if (typeof prefs.dark === 'boolean') state.dark = prefs.dark;
      if (typeof prefs.sound === 'boolean') soundEnabled = prefs.sound;
      if (typeof prefs.goConfirm === 'boolean') state.goConfirmMode = prefs.goConfirm;
    }
  } catch (e) {}

  function savePrefs() {
    try {
      localStorage.setItem('kydao_prefs_v2', JSON.stringify({
        dark: state.dark,
        sound: soundEnabled,
        goConfirm: state.goConfirmMode
      }));
    } catch (e) {}
  }

  function saveSolved(id) {
    state.solvedMap[id] = true;
    try {
      localStorage.setItem('kydao_solved_v1', JSON.stringify(state.solvedMap));
    } catch (e) {}
    updateProgressUI();
  }

  function clearAllTimers() {
    if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; }
    if (state.replyTimer) { clearTimeout(state.replyTimer); state.replyTimer = null; }
    if (state.solveTimer) { clearTimeout(state.solveTimer); state.solveTimer = null; }
    state.puzzleBusy = false;
  }

  function goCoordLabel(r, c) {
    const cols = ['A','B','C','D','E','F','G','H','J'];
    return cols[c] + String(9 - r);
  }

  function setQuickNav(idx, total, onPrev, onNext) {
    if (!boardQuickNavEl) return;
    if (total <= 1) {
      boardQuickNavEl.style.display = 'none';
      boardQuickNavEl.innerHTML = '';
      return;
    }
    boardQuickNavEl.style.display = 'inline-flex';
    boardQuickNavEl.innerHTML = `
      <button class="quick-btn" id="qnPrev" ${idx <= 0 ? 'disabled' : ''} title="Bài trước">◀</button>
      <span class="quick-counter">${idx + 1}/${total}</span>
      <button class="quick-btn" id="qnNext" ${idx >= total - 1 ? 'disabled' : ''} title="Bài tiếp">▶</button>
    `;
    document.getElementById('qnPrev').addEventListener('click', onPrev);
    document.getElementById('qnNext').addEventListener('click', onNext);
  }

  function hideQuickNav() {
    if (boardQuickNavEl) {
      boardQuickNavEl.style.display = 'none';
      boardQuickNavEl.innerHTML = '';
    }
  }

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  function setStatus(text, type = 'info') {
    statusTextEl.textContent = text;
    boardStatusEl.className = 'board-status ' + type;
  }

  function scrollToBoardOnMobile() {
    if (window.innerWidth <= 960 && boardSectionEl) {
      boardSectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function updateProgressUI() {
    const allIds = ['xiangqi', 'chess', 'go'].flatMap(g => CONTENT[g].puzzles.map(p => p.id));
    const solvedCount = allIds.filter(id => state.solvedMap[id]).length;
    const pct = Math.round((solvedCount / allIds.length) * 100);
    document.getElementById('progressText').textContent = `${solvedCount}/${allIds.length}`;
    document.getElementById('mobileProgressText').textContent = `${solvedCount}/${allIds.length}`;
    document.getElementById('progressFill').style.width = `${pct}%`;
  }

  function updateTurnBadge() {
    if (state.game === 'xiangqi') {
      turnBadgeEl.textContent = state.turn === 'r' ? 'Lượt: Đỏ đi' : 'Lượt: Đen đi';
      turnBadgeEl.className = 'turn-badge ' + (state.turn === 'r' ? 'red' : 'black');
    } else if (state.game === 'chess') {
      turnBadgeEl.textContent = state.turn === 'w' ? 'Lượt: Trắng đi' : 'Lượt: Đen đi';
      turnBadgeEl.className = 'turn-badge ' + (state.turn === 'w' ? 'white' : 'black');
    } else {
      turnBadgeEl.textContent = state.turn === 'B' ? 'Lượt: Quân Đen' : 'Lượt: Quân Trắng';
      turnBadgeEl.className = 'turn-badge ' + (state.turn === 'B' ? 'black' : 'white');
    }
  }

  function getLogicalSize() {

    const { w, h } = getLogicalSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    if (canvasWrapEl) {
      canvasWrapEl.classList.toggle('is-xiangqi', state.game === 'xiangqi');
      canvasWrapEl.classList.toggle('is-square', state.game !== 'xiangqi');
    }
  }

  function getBoardMetrics() {
    const { w, h } = getLogicalSize();
    if (state.game === 'xiangqi') {
      const padX = 36, padY = 44;
      const cell = Math.min((w - padX * 2) / 8, (h - padY * 2) / 9);
      const ox = (w - cell * 8) / 2;
      const oy = (h - cell * 9) / 2;
      return { ox, oy, cell, rows: 10, cols: 9, intersection: true, w, h };
    } else if (state.game === 'chess') {
      const pad = 28;
      const cell = Math.min((w - pad * 2) / 8, (h - pad * 2) / 8);
      const ox = (w - cell * 8) / 2;
      const oy = (h - cell * 8) / 2;
      return { ox, oy, cell, rows: 8, cols: 8, intersection: false, w, h };
    } else {
      const pad = 40;
      const cell = Math.min((w - pad * 2) / 8, (h - pad * 2) / 8);
      const ox = (w - cell * 8) / 2;
      const oy = (h - cell * 8) / 2;
      return { ox, oy, cell, rows: 9, cols: 9, intersection: true, w, h };
    }
  }

  function cellCenter(r, c, m) {
    if (m.intersection) return { x: m.ox + c * m.cell, y: m.oy + r * m.cell };
    return { x: m.ox + (c + 0.5) * m.cell, y: m.oy + (r + 0.5) * m.cell };
  }

  function drawArrow(x1, y1, x2, y2, color) {
    const headLen = 14;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2 - headLen * 0.7 * Math.cos(angle), y2 - headLen * 0.7 * Math.sin(angle));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function renderBoard() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const m = getBoardMetrics();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, m.w, m.h);

    if (state.game === 'xiangqi') renderXiangqi(m);
    else if (state.game === 'chess') renderChess(m);
    else renderGo(m);

    // Draw tactical arrows
    state.arrows.forEach(([from, to]) => {
      const p1 = cellCenter(from[0], from[1], m);
      const p2 = cellCenter(to[0], to[1], m);
      drawArrow(p1.x, p1.y, p2.x, p2.y, 'rgba(217, 119, 6, 0.88)');
    });

    // Draw warning X markers (blocked horse leg / elephant eye)
    state.warnCells.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      const rad = m.cell * 0.46;
      ctx.save();
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // Draw hint rings
    state.hintCells.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      ctx.save();
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 4;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, m.cell * 0.45, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawXqStar(cx, cy, col) {
    const d = 4, l = 8;
    ctx.save();
    ctx.strokeStyle = '#5c3a21';
    ctx.lineWidth = 1.3;
    const drawCorner = (sx, sy) => {
      ctx.beginPath();
      ctx.moveTo(cx + sx * d, cy + sy * (d + l));
      ctx.lineTo(cx + sx * d, cy + sy * d);
      ctx.lineTo(cx + sx * (d + l), cy + sy * d);
      ctx.stroke();
    };
    if (col > 0) { drawCorner(-1, -1); drawCorner(-1, 1); }
    if (col < 8) { drawCorner(1, -1); drawCorner(1, 1); }
    ctx.restore();
  }

  function renderXiangqi(m) {
    const grad = ctx.createLinearGradient(0, 0, m.w, m.h);
    grad.addColorStop(0, '#f4d9a6');
    grad.addColorStop(1, '#deb471');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, m.w, m.h);

    // Outer double frame
    ctx.strokeStyle = '#6b4226';
    ctx.lineWidth = 2.6;
    ctx.strokeRect(m.ox - 6, m.oy - 6, m.cell * 8 + 12, m.cell * 9 + 12);

    // Grid lines
    ctx.strokeStyle = '#5c3a21';
    ctx.lineWidth = 1.35;
    for (let r = 0; r < 10; r++) {
      ctx.beginPath();
      ctx.moveTo(m.ox, m.oy + r * m.cell);
      ctx.lineTo(m.ox + 8 * m.cell, m.oy + r * m.cell);
      ctx.stroke();
    }
    for (let c = 0; c < 9; c++) {
      if (c === 0 || c === 8) {
        ctx.beginPath();
        ctx.moveTo(m.ox + c * m.cell, m.oy);
        ctx.lineTo(m.ox + c * m.cell, m.oy + 9 * m.cell);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(m.ox + c * m.cell, m.oy);
        ctx.lineTo(m.ox + c * m.cell, m.oy + 4 * m.cell);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(m.ox + c * m.cell, m.oy + 5 * m.cell);
        ctx.lineTo(m.ox + c * m.cell, m.oy + 9 * m.cell);
        ctx.stroke();
      }
    }

    // Star markers (Cannons & Pawns)
    [[2,1],[2,7],[7,1],[7,7],[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8]].forEach(([r, c]) => {
      drawXqStar(m.ox + c * m.cell, m.oy + r * m.cell, c);
    });

    // Palaces X
    const drawX = (r0) => {
      ctx.beginPath();
      ctx.moveTo(m.ox + 3 * m.cell, m.oy + r0 * m.cell);
      ctx.lineTo(m.ox + 5 * m.cell, m.oy + (r0 + 2) * m.cell);
      ctx.moveTo(m.ox + 5 * m.cell, m.oy + r0 * m.cell);
      ctx.lineTo(m.ox + 3 * m.cell, m.oy + (r0 + 2) * m.cell);
      ctx.stroke();
    };
    drawX(0); drawX(7);

    // River text
    ctx.fillStyle = '#6b4226';
    ctx.font = 'bold 19px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('楚 河   (Sở Hà)', m.ox + 2 * m.cell, m.oy + 4.5 * m.cell);
    ctx.fillText('漢 界   (Hán Giới)', m.ox + 6 * m.cell, m.oy + 4.5 * m.cell);

    // Standard Xiangqi file numbers (Black 1..9 top, Red 9..1 bottom)
    ctx.font = 'bold 12px sans-serif';
    for (let c = 0; c < 9; c++) {
      ctx.fillStyle = '#374151';
      ctx.fillText(String(c + 1), m.ox + c * m.cell, 12);
      ctx.fillStyle = '#991b1b';
      ctx.fillText(String(9 - c), m.ox + c * m.cell, m.h - 12);
    }

    // Check highlight on King in live play
    const rCheck = xqInCheck(state.board, 'r');
    const bCheck = xqInCheck(state.board, 'b');
    if (rCheck || bCheck) {
      const { rK, bK } = xqFindKings(state.board);
      [rCheck ? rK : null, bCheck ? bK : null].filter(Boolean).forEach(([kr, kc]) => {
        const p = cellCenter(kr, kc, m);
        ctx.fillStyle = 'rgba(220, 38, 38, 0.42)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, m.cell * 0.49, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Highlights
    state.highlights.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      ctx.fillStyle = 'rgba(217, 119, 6, 0.28)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, m.cell * 0.36, 0, Math.PI * 2);
      ctx.fill();
    });

    // Last move markers
    if (state.lastMove) {
      [state.lastMove.from, state.lastMove.to].filter(Boolean).forEach(([r, c]) => {
        const p = cellCenter(r, c, m);
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.78)';
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x - m.cell * 0.44, p.y - m.cell * 0.44, m.cell * 0.88, m.cell * 0.88);
      });
    }

    // Legal moves
    state.legalMoves.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      const hasPiece = !!state.board[r][c];
      ctx.fillStyle = hasPiece ? 'rgba(220, 38, 38, 0.36)' : 'rgba(22, 163, 74, 0.68)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, hasPiece ? m.cell * 0.45 : m.cell * 0.16, 0, Math.PI * 2);
      ctx.fill();
    });

    // Pieces
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        const code = state.board[r][c];
        if (!code) continue;
        const info = XQ_LABELS[code];
        const p = cellCenter(r, c, m);
        const rad = m.cell * 0.42;
        const isSel = state.selected && state.selected[0] === r && state.selected[1] === c;

        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.arc(p.x + 2, p.y + 3, rad, 0, Math.PI * 2);
        ctx.fill();

        const dg = ctx.createRadialGradient(p.x - 5, p.y - 5, 3, p.x, p.y, rad);
        dg.addColorStop(0, '#fffdf7');
        dg.addColorStop(1, '#e8d6b3');
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = isSel ? 3.5 : 2;
        ctx.strokeStyle = isSel ? '#2563eb' : (info.color === 'r' ? '#b91c1c' : '#1f2937');
        ctx.stroke();

        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad * 0.84, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = info.color === 'r' ? '#b91c1c' : '#111827';
        ctx.font = `bold ${Math.round(rad * 1.12)}px "Noto Serif", Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.char, p.x, p.y - 3);

        ctx.font = `700 ${Math.round(rad * 0.35)}px sans-serif`;
        ctx.fillText(info.vi, p.x, p.y + rad * 0.56);
      }
    }
  }

  // Vector Staunton Chess Piece Renderer (crisp & identical on Windows, iOS, Android)
  function drawChessPieceVector(type, color, cx, cy, size) {
    const s = size * 0.44;
    const isW = color === 'w';
    ctx.save();
    ctx.translate(cx, cy);

    // Drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;

    if (isW) {
      const g = ctx.createLinearGradient(-s, -s, s, s);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#e5dccb');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#1e293b';
    } else {
      const g = ctx.createLinearGradient(-s, -s, s, s);
      g.addColorStop(0, '#374151');
      g.addColorStop(1, '#0f172a');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#0f172a';
    }
    ctx.lineWidth = 1.9;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const drawBase = (y = 0.82, w = 0.68) => {
      ctx.beginPath();
      ctx.moveTo(-s * w, s * y);
      ctx.lineTo(s * w, s * y);
      ctx.lineTo(s * (w * 0.88), s * (y - 0.17));
      ctx.lineTo(-s * (w * 0.88), s * (y - 0.17));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    };

    if (type === 'P') {
      ctx.beginPath();
      ctx.arc(0, -s * 0.42, s * 0.25, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-s * 0.22, -s * 0.17);
      ctx.quadraticCurveTo(-s * 0.36, s * 0.36, -s * 0.46, s * 0.64);
      ctx.lineTo(s * 0.46, s * 0.64);
      ctx.quadraticCurveTo(s * 0.36, s * 0.36, s * 0.22, -s * 0.17);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      drawBase(0.8, 0.56);
    } else if (type === 'R') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.52, -s * 0.72);
      ctx.lineTo(-s * 0.32, -s * 0.72); ctx.lineTo(-s * 0.32, -s * 0.52);
      ctx.lineTo(-s * 0.12, -s * 0.52); ctx.lineTo(-s * 0.12, -s * 0.72);
      ctx.lineTo(s * 0.12, -s * 0.72); ctx.lineTo(s * 0.12, -s * 0.52);
      ctx.lineTo(s * 0.32, -s * 0.52); ctx.lineTo(s * 0.32, -s * 0.72);
      ctx.lineTo(s * 0.52, -s * 0.72);
      ctx.lineTo(s * 0.52, -s * 0.36);
      ctx.lineTo(s * 0.36, -s * 0.24);
      ctx.lineTo(s * 0.4, s * 0.64);
      ctx.lineTo(-s * 0.4, s * 0.64);
      ctx.lineTo(-s * 0.36, -s * 0.24);
      ctx.lineTo(-s * 0.52, -s * 0.36);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      drawBase(0.82, 0.66);
    } else if (type === 'B') {
      ctx.beginPath();
      ctx.arc(0, -s * 0.76, s * 0.11, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -s * 0.64);
      ctx.bezierCurveTo(s * 0.44, -s * 0.36, s * 0.38, s * 0.24, s * 0.34, s * 0.64);
      ctx.lineTo(-s * 0.34, s * 0.64);
      ctx.bezierCurveTo(-s * 0.38, s * 0.24, -s * 0.44, -s * 0.36, 0, -s * 0.64);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Miter slash
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = isW ? '#1e293b' : '#cbd5e1';
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(-s * 0.14, -s * 0.24);
      ctx.lineTo(s * 0.14, -s * 0.02);
      ctx.moveTo(-s * 0.26, s * 0.34);
      ctx.lineTo(s * 0.26, s * 0.34);
      ctx.stroke();
      ctx.strokeStyle = isW ? '#1e293b' : '#0f172a';
      ctx.lineWidth = 1.9;
      drawBase(0.82, 0.64);
    } else if (type === 'N') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.44, s * 0.64);
      ctx.bezierCurveTo(-s * 0.44, s * 0.1, -s * 0.22, -s * 0.16, -s * 0.08, -s * 0.22);
      ctx.lineTo(-s * 0.42, -s * 0.05);
      ctx.quadraticCurveTo(-s * 0.58, -s * 0.18, -s * 0.45, -s * 0.36);
      ctx.lineTo(-s * 0.14, -s * 0.62);
      ctx.lineTo(-s * 0.08, -s * 0.8);
      ctx.lineTo(s * 0.08, -s * 0.65);
      ctx.bezierCurveTo(s * 0.56, -s * 0.56, s * 0.64, s * 0.12, s * 0.42, s * 0.64);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Eye detail
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = isW ? '#1e293b' : '#e2e8f0';
      ctx.beginPath();
      ctx.arc(-s * 0.14, -s * 0.42, s * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isW ? '#f8fafc' : '#1f2937';
      drawBase(0.82, 0.66);
    } else if (type === 'Q') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.46, s * 0.62);
      ctx.lineTo(-s * 0.66, -s * 0.36);
      ctx.lineTo(-s * 0.3, -s * 0.05);
      ctx.lineTo(-s * 0.26, -s * 0.58);
      ctx.lineTo(0, -s * 0.12);
      ctx.lineTo(s * 0.26, -s * 0.58);
      ctx.lineTo(s * 0.3, -s * 0.05);
      ctx.lineTo(s * 0.66, -s * 0.36);
      ctx.lineTo(s * 0.46, s * 0.62);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      [[-0.66,-0.42],[-0.26,-0.64],[0,-0.74],[0.26,-0.64],[0.66,-0.42]].forEach(([px, py]) => {
        ctx.beginPath();
        ctx.arc(s * px, s * py, s * 0.09, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });
      drawBase(0.82, 0.68);
    } else if (type === 'K') {
      // Cross on top
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = isW ? '#1e293b' : '#cbd5e1';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.88); ctx.lineTo(0, -s * 0.52);
      ctx.moveTo(-s * 0.17, -s * 0.72); ctx.lineTo(s * 0.17, -s * 0.72);
      ctx.stroke();

      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.strokeStyle = isW ? '#1e293b' : '#0f172a';
      ctx.lineWidth = 1.9;
      ctx.beginPath();
      ctx.moveTo(-s * 0.44, s * 0.62);
      ctx.bezierCurveTo(-s * 0.72, -s * 0.12, -s * 0.34, -s * 0.56, 0, -s * 0.46);
      ctx.bezierCurveTo(s * 0.34, -s * 0.56, s * 0.72, -s * 0.12, s * 0.44, s * 0.62);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = isW ? '#1e293b' : '#cbd5e1';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.44); ctx.lineTo(0, s * 0.5);
      ctx.stroke();
      ctx.strokeStyle = isW ? '#1e293b' : '#0f172a';
      ctx.lineWidth = 1.9;
      drawBase(0.82, 0.68);
    }

    // Extra subtle rim accent for black pieces so details pop
    if (!isW) {
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-s * 0.54, s * 0.66);
      ctx.lineTo(s * 0.54, s * 0.66);
      ctx.stroke();
    }
    ctx.restore();
  }

  function renderChess(m) {
    ctx.fillStyle = '#3b2f26';
    ctx.fillRect(0, 0, m.w, m.h);

    const wCheck = chessInCheck(state.board, 'w') ? chessFindKing(state.board, 'w') : null;
    const bCheck = chessInCheck(state.board, 'b') ? chessFindKing(state.board, 'b') : null;

    const files = ['a','b','c','d','e','f','g','h'];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const x = m.ox + c * m.cell;
        const y = m.oy + r * m.cell;
        const light = (r + c) % 2 === 0;
        ctx.fillStyle = light ? '#f0d9b5' : '#b58863';
        ctx.fillRect(x, y, m.cell, m.cell);

        if (state.lastMove) {
          const isLast = (state.lastMove.from && state.lastMove.from[0] === r && state.lastMove.from[1] === c) ||
                         (state.lastMove.to && state.lastMove.to[0] === r && state.lastMove.to[1] === c);
          if (isLast) {
            ctx.fillStyle = 'rgba(245, 199, 44, 0.45)';
            ctx.fillRect(x, y, m.cell, m.cell);
          }
        }
        if (state.selected && state.selected[0] === r && state.selected[1] === c) {
          ctx.fillStyle = 'rgba(37, 99, 235, 0.38)';
          ctx.fillRect(x, y, m.cell, m.cell);
        }
        if ((wCheck && wCheck[0] === r && wCheck[1] === c) || (bCheck && bCheck[0] === r && bCheck[1] === c)) {
          const rg = ctx.createRadialGradient(x + m.cell/2, y + m.cell/2, 4, x + m.cell/2, y + m.cell/2, m.cell * 0.55);
          rg.addColorStop(0, 'rgba(220, 38, 38, 0.8)');
          rg.addColorStop(1, 'rgba(220, 38, 38, 0)');
          ctx.fillStyle = rg;
          ctx.fillRect(x, y, m.cell, m.cell);
        }
      }
    }

    // Coordinates
    ctx.fillStyle = '#e7dccb';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < 8; i++) {
      ctx.fillText(files[i], m.ox + (i + 0.5) * m.cell, m.oy + 8 * m.cell + 14);
      ctx.fillText(String(8 - i), m.ox - 14, m.oy + (i + 0.5) * m.cell);
    }

    // Highlights
    state.highlights.forEach(([r, c]) => {
      ctx.fillStyle = 'rgba(217, 119, 6, 0.32)';
      ctx.fillRect(m.ox + c * m.cell, m.oy + r * m.cell, m.cell, m.cell);
    });

    // Legal moves
    state.legalMoves.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      const hasPiece = !!state.board[r][c];
      ctx.fillStyle = hasPiece ? 'rgba(220, 38, 38, 0.42)' : 'rgba(22, 163, 74, 0.6)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, hasPiece ? m.cell * 0.42 : m.cell * 0.16, 0, Math.PI * 2);
      ctx.fill();
    });

    // Pieces
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const code = state.board[r][c];
        if (!code) continue;
        const p = cellCenter(r, c, m);
        drawChessPieceVector(code[1], code[0], p.x, p.y, m.cell);
      }
    }
  }

  function renderGo(m) {
    const grad = ctx.createLinearGradient(0, 0, m.w, m.h);
    grad.addColorStop(0, '#e8c17a');
    grad.addColorStop(1, '#d3a355');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, m.w, m.h);

    ctx.strokeStyle = '#2d1e12';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      ctx.beginPath();
      ctx.moveTo(m.ox, m.oy + i * m.cell);
      ctx.lineTo(m.ox + 8 * m.cell, m.oy + i * m.cell);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(m.ox + i * m.cell, m.oy);
      ctx.lineTo(m.ox + i * m.cell, m.oy + 8 * m.cell);
      ctx.stroke();
    }

    const cols = ['A','B','C','D','E','F','G','H','J'];
    ctx.fillStyle = '#4a3219';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < 9; i++) {
      ctx.fillText(cols[i], m.ox + i * m.cell, m.oy + 8 * m.cell + 21);
      ctx.fillText(String(9 - i), m.ox - 21, m.oy + i * m.cell);
    }

    // Star points (Hoshi)
    [[2,2],[2,6],[4,4],[6,2],[6,6]].forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      ctx.fillStyle = '#2d1e12';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Highlights
    state.highlights.forEach(([r, c]) => {
      const p = cellCenter(r, c, m);
      ctx.fillStyle = 'rgba(22, 163, 74, 0.38)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, m.cell * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // Stones
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const s = state.board[r][c];
        if (!s) continue;
        const p = cellCenter(r, c, m);
        const rad = m.cell * 0.44;

        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.arc(p.x + 2, p.y + 3, rad, 0, Math.PI * 2);
        ctx.fill();

        const sg = ctx.createRadialGradient(p.x - rad * 0.3, p.y - rad * 0.3, rad * 0.1, p.x, p.y, rad);
        if (s === 'B') {
          sg.addColorStop(0, '#4b5563');
          sg.addColorStop(1, '#0f172a');
        } else {
          sg.addColorStop(0, '#ffffff');
          sg.addColorStop(1, '#d1d5db');
        }
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
        if (s === 'W') {
          ctx.strokeStyle = '#9ca3af';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        const num = state.goMoveNumbers[r + ',' + c];
        if (num) {
          ctx.fillStyle = s === 'B' ? '#f8fafc' : '#111827';
          ctx.font = `bold ${Math.round(rad * 0.78)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(num), p.x, p.y + 1);
        } else if (state.lastMove && state.lastMove.to && state.lastMove.to[0] === r && state.lastMove.to[1] === c) {
          ctx.strokeStyle = s === 'B' ? '#f8fafc' : '#dc2626';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad * 0.46, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    // 2-tap Aim Preview for touch screens (keeps stone visible above finger)
    if (state.goPreview) {
      const [pr, pc] = state.goPreview;
      if (pr >= 0 && pr < 9 && pc >= 0 && pc < 9 && !state.board[pr][pc]) {
        const p = cellCenter(pr, pc, m);
        const rad = m.cell * 0.44;
        const previewColor = (state.mode === 'sandbox' && state.sandboxTool === 'place') ? state.sandboxPiece : state.turn;
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = previewColor === 'B' ? '#0f172a' : '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad * 1.12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Coordinate callout shifted above finger so thumb never hides it
        const label = goCoordLabel(pr, pc);
        const tagY = pr === 0 ? p.y + m.cell * 0.85 : p.y - m.cell * 0.85;
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - 18, tagY - 11, 36, 22, 6);
        else ctx.rect(p.x - 18, tagY - 11, 36, 22);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, p.x, tagY + 1);
        ctx.restore();
      }
    }
  }

  // =========================================================================
  // 8. MODE LOADERS & UI RENDERERS
  // =========================================================================
  function resetCommonBoardVisuals() {
    clearAllTimers();
    state.selected = null;
    state.legalMoves = [];
    state.highlights = [];
    state.warnCells = [];
    state.arrows = [];
    state.lastMove = null;
    state.hintCells = [];
    state.goMoveNumbers = {};
    state.goPreview = null;
    if (boardControlsEl) boardControlsEl.className = 'board-controls';
    if (mobileSandboxDockEl) {
      mobileSandboxDockEl.className = 'mobile-sb-dock';
      mobileSandboxDockEl.innerHTML = '';
    }
  }

  function loadCurrentView() {
    resizeCanvasForGame();
    resetCommonBoardVisuals();
    if (state.mode === 'curriculum') loadCurriculumView();
    else if (state.mode === 'pieces') loadPiecesView();
    else if (state.mode === 'puzzles') loadPuzzlesView();
    else loadSandboxView();
    updateTurnBadge();
    renderBoard();
  }

        <div class="item-list" id="lessonList">
          ${gameData.curriculum.map((item, idx) => `

              <div class="list-item-top">

        </div>
        <div class="piece-grid" id="pieceGrid">

  // --- MODE 3: FORMATIONS & PUZZLES (PHỔ BIẾN → CHUYÊN NGHIỆP) ---
  function getFilteredPuzzles() {
    return CONTENT[state.game].puzzles.filter(p => {
      const okType = state.typeFilter === 'all' || p.kind === state.typeFilter;
      const okDiff = state.diffFilter === 'all' || p.diff === state.diffFilter;
      return okType && okDiff;
    });
  }

  function applyFormationStep(puz, targetStep) {
    state.board = puz.board();
    state.arrows = [];
    state.lastMove = null;
    state.goMoveNumbers = {};
    state.formStep = Math.max(0, Math.min(targetStep, puz.steps.length));

    for (let i = 0; i < state.formStep; i++) {
      const st = puz.steps[i];
      if (state.game === 'go') {
        const res = goTryPlace(state.board, st.to[0], st.to[1], st.color);
        if (res.ok) state.board = res.board;
        state.goMoveNumbers[st.to[0] + ',' + st.to[1]] = i + 1;
        state.lastMove = { to: st.to };
      } else {
        state.board[st.to[0]][st.to[1]] = state.board[st.from[0]][st.from[1]];
        state.board[st.from[0]][st.from[1]] = null;
        if (st.extra) {
          state.board[st.extra.to[0]][st.extra.to[1]] = state.board[st.extra.from[0]][st.extra.from[1]];
          state.board[st.extra.from[0]][st.extra.from[1]] = null;
        }
        state.lastMove = { from: st.from, to: st.to };
        if (i === state.formStep - 1) state.arrows = [[st.from, st.to]];
      }
    }

    if (state.game === 'xiangqi') {
      state.turn = state.formStep % 2 === 0 ? 'r' : 'b';
    } else if (state.game === 'chess') {
      state.turn = state.formStep % 2 === 0 ? 'w' : 'b';
    } else {
      const nextSt = puz.steps[state.formStep];
      state.turn = nextSt ? nextSt.color : (puz.steps[puz.steps.length - 1].color === 'B' ? 'W' : 'B');
    }
    updateTurnBadge();

    if (state.formStep === 0) {
      setStatus('Bắt đầu bố trí từ hình xuất phát. Nhấn "Bước tiếp" hoặc "Tự động chạy".', 'info');
    } else {
      setStatus(puz.steps[state.formStep - 1].note, state.formStep === puz.steps.length ? 'success' : 'info');
      if (state.formStep === puz.steps.length) saveSolved(puz.id);
    }
  }

  function loadPuzzlesView() {
    resetCommonBoardVisuals();
    let list = getFilteredPuzzles();
    if (!list.length) {
      state.typeFilter = 'all';
      state.diffFilter = 'all';
      list = getFilteredPuzzles();
    }
    if (state.puzzleIdx >= list.length) state.puzzleIdx = 0;
    const puz = list[state.puzzleIdx];

    state.board = puz.board();
    state.turn = puz.turn;
    state.formStep = 0;
    state.puzzleStep = 0;
    state.puzzleSolvedNow = false;
    updateTurnBadge();

    setQuickNav(
      state.puzzleIdx,
      list.length,
      () => { if (state.puzzleIdx > 0) { state.puzzleIdx--; loadPuzzlesView(); renderBoard(); } },
      () => { if (state.puzzleIdx < list.length - 1) { state.puzzleIdx++; loadPuzzlesView(); renderBoard(); } }
    );

    boardTitleEl.textContent = puz.title;
    setStatus(puz.goal, 'info');

    const diffClass = (d) => ({ easy: 'badge-easy', med: 'badge-med', hard: 'badge-hard', master: 'badge-master' }[d] || 'badge-easy');

    if (puz.kind === 'formation') {
      boardControlsEl.className = 'board-controls ctrl-4';
      boardControlsEl.innerHTML = `
        <button class="btn" id="btnFormReset">⏮️ Đầu</button>
        <button class="btn" id="btnFormPrev">⬅️ Lùi</button>
        <button class="btn btn-primary" id="btnFormNext"><span class="btn-mob-full">Bước </span>Tiếp ➡️</button>
        <button class="btn" id="btnFormAuto">▶️ <span class="btn-mob-full">Tự </span>động</button>
      `;
      document.getElementById('btnFormReset').addEventListener('click', () => {
        clearAllTimers();
        applyFormationStep(puz, 0);
        const btn = document.getElementById('btnFormAuto');
        if (btn) btn.innerHTML = '▶️ <span class="btn-mob-full">Tự </span>động';
        renderFormationTimeline(puz);
        renderBoard();
      });
      document.getElementById('btnFormPrev').addEventListener('click', () => {
        clearAllTimers();
        const btn = document.getElementById('btnFormAuto');
        if (btn) btn.innerHTML = '▶️ <span class="btn-mob-full">Tự </span>động';
        if (state.formStep > 0) {
          applyFormationStep(puz, state.formStep - 1);
          playTone('move');
          renderFormationTimeline(puz);
          renderBoard();
        }
      });
      document.getElementById('btnFormNext').addEventListener('click', () => {
        clearAllTimers();
        const btn = document.getElementById('btnFormAuto');
        if (btn) btn.innerHTML = '▶️ <span class="btn-mob-full">Tự </span>động';
        if (state.formStep < puz.steps.length) {
          applyFormationStep(puz, state.formStep + 1);
          playTone('move');
          renderFormationTimeline(puz);
          renderBoard();
        }
      });
      document.getElementById('btnFormAuto').addEventListener('click', () => {
        const autoBtn = document.getElementById('btnFormAuto');
        if (state.autoTimer) {
          clearAllTimers();
          autoBtn.innerHTML = '▶️ <span class="btn-mob-full">Tự </span>động';
          return;
        }
        if (state.formStep >= puz.steps.length) applyFormationStep(puz, 0);
        autoBtn.innerHTML = '⏸️ Dừng';
        state.autoTimer = setInterval(() => {
          if (state.formStep < puz.steps.length) {
            applyFormationStep(puz, state.formStep + 1);
            playTone('move');
            renderFormationTimeline(puz);
            renderBoard();
          } else {
            clearAllTimers();
            const b = document.getElementById('btnFormAuto');
            if (b) b.innerHTML = '▶️ Lại';
          }
        }, 1250);
      });
    } else {
      boardControlsEl.className = state.game === 'go' ? 'board-controls ctrl-4' : 'board-controls ctrl-3';
      boardControlsEl.innerHTML = `
        <button class="btn" id="btnPuzReset">🔄 <span class="btn-mob-full">Làm </span>lại</button>
        <button class="btn" id="btnPuzHint">💡 Gợi ý</button>
        <button class="btn btn-primary" id="btnPuzSolve">👁️ <span class="btn-mob-full">Xem lời </span>Giải</button>
        ${state.game === 'go' ? `<button class="btn" id="btnGoConfirm">🎯 2 chạm${state.goConfirmMode ? ' ✓' : ''}</button>` : ''}
      `;
      document.getElementById('btnPuzReset').addEventListener('click', () => {
        loadPuzzlesView();
        renderBoard();
      });
      document.getElementById('btnPuzHint').addEventListener('click', () => {
        if (state.puzzleSolvedNow || state.puzzleBusy) return;
        const step = puz.solution[state.puzzleStep];
        state.hintCells = state.game === 'go' ? [step.to] : [step.from, step.to];
        setStatus(`💡 Gợi ý (Nước ${state.puzzleStep + 1}): ${puz.hint}`, 'info');
        renderBoard();
      });
      document.getElementById('btnPuzSolve').addEventListener('click', () => {
        clearAllTimers();
        state.board = puz.board();
        state.turn = puz.turn;
        state.puzzleStep = 0;
        state.puzzleSolvedNow = true;
        state.puzzleBusy = true;
        state.selected = null;
        state.legalMoves = [];
        state.hintCells = [];
        state.goPreview = null;
        state.arrows = [];
        state.lastMove = null;
        updateTurnBadge();
        renderBoard();

        let idx = 0;
        const runStep = () => {
          if (idx >= puz.solution.length) {
            state.puzzleBusy = false;
            setStatus('👁️ Đã trình chiếu xong lời giải! Nhấn "🔄 Làm lại" để tự tay thực hành ghi điểm.', 'info');
            return;
          }
          const st = puz.solution[idx];
          executePuzzleMove(puz, st, true, () => {
            idx++;
            state.solveTimer = setTimeout(runStep, 700);
          });
        };
        runStep();
      });
      const btnConfirm = document.getElementById('btnGoConfirm');
      if (btnConfirm) {
        btnConfirm.addEventListener('click', () => {
          state.goConfirmMode = !state.goConfirmMode;
          state.goPreview = null;

  function renderFormationTimeline(puz) {

        <span class="step-num">${idx + 1}</span>
        <span>${st.note}</span>
      </div>
    `).join('');
    el.querySelectorAll('.step-row').forEach(row => {
      row.addEventListener('click', () => {
        clearAllTimers();
        const btn = document.getElementById('btnFormAuto');
        if (btn) btn.innerHTML = '▶️ <span class="btn-mob-full">Tự </span>động';
        applyFormationStep(puz, Number(row.dataset.step));
        playTone('move');
        renderFormationTimeline(puz);
        renderBoard();
      });

  function executePuzzleMove(puz, st, isAuto, onDone = null) {
    state.goPreview = null;
    if (state.game === 'go') {
      const res = goTryPlace(state.board, st.to[0], st.to[1], puz.turn);
      if (res.ok) state.board = res.board;
      state.lastMove = { to: st.to };
      playTone(res.captured > 0 ? 'capture' : 'move');
    } else {
      const cap = !!state.board[st.to[0]][st.to[1]];
      state.board[st.to[0]][st.to[1]] = state.board[st.from[0]][st.from[1]];
      state.board[st.from[0]][st.from[1]] = null;
      state.lastMove = { from: st.from, to: st.to };
      state.arrows = [[st.from, st.to]];
      playTone(cap ? 'capture' : 'move');
    }
    state.selected = null;
    state.legalMoves = [];
    state.hintCells = [];
    setStatus(st.note, 'success');
    renderBoard();

    if (st.reply) {
      state.puzzleBusy = true;
      state.replyTimer = setTimeout(() => {
        if (state.game === 'go') {
          const rres = goTryPlace(state.board, st.reply.to[0], st.reply.to[1], st.reply.color);
          if (rres.ok) state.board = rres.board;
          state.lastMove = { to: st.reply.to };
        } else {
          state.board[st.reply.to[0]][st.reply.to[1]] = state.board[st.reply.from[0]][st.reply.from[1]];
          state.board[st.reply.from[0]][st.reply.from[1]] = null;
          state.lastMove = { from: st.reply.from, to: st.reply.to };
          state.arrows = [[st.reply.from, st.reply.to]];
        }
        state.puzzleBusy = isAuto;
        playTone('move');
        if (!isAuto) setStatus('Đối phương đã đáp trả! Hãy đi nước quyết định tiếp theo.', 'info');
        renderBoard();
        if (onDone) onDone();
      }, 460);
    } else if (onDone) {
      onDone();
    }
  }

  // --- MODE 4: SANDBOX ---
  function pushSandboxHistory() {
    state.sandboxHistory.push({
      board: cloneGrid(state.board),
      turn: state.turn,
      capturedGo: { ...state.capturedGo },
      lastMove: state.lastMove,
      castling: { ...state.castling },
      enPassant: state.enPassant ? [...state.enPassant] : null,
      prevGoHash: state.prevGoHash
    });
  }

        renderBoard();
