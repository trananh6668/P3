  function openChessPromoModal(color, r, c) {
    state.pendingPromo = { color, r, c };
    const choices = [
      { code: 'Q', label: 'Hậu (9đ)', sym: color === 'w' ? '♕' : '♛' },
      { code: 'R', label: 'Xe (5đ)', sym: color === 'w' ? '♖' : '♜' },
      { code: 'B', label: 'Tượng (3đ)', sym: color === 'w' ? '♗' : '♝' },
      { code: 'N', label: 'Mã (3đ)', sym: color === 'w' ? '♘' : '♞' }
    ];
    promoChoicesEl.innerHTML = choices.map(ch => `
      <button class="promo-choice" data-promo="${ch.code}">
        <span>${ch.sym}</span>
        <span>${ch.label}</span>
      </button>
    `).join('');
    promoChoicesEl.querySelectorAll('.promo-choice').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = state.pendingPromo;
        if (!p) return;
        state.board[p.r][p.c] = p.color + btn.dataset.promo;
        state.pendingPromo = null;
        promoModalEl.classList.remove('open');
        playTone('success');
        finishChessSandboxTurn();
      });
    });
    promoModalEl.classList.add('open');
  }

  function finishChessSandboxTurn() {
    state.turn = state.turn === 'w' ? 'b' : 'w';
    const opts = { castling: state.castling, enPassant: state.enPassant };
    const inCheck = chessInCheck(state.board, state.turn);
    const hasLegal = chessHasAnyLegal(state.board, state.turn, opts);
    const side = state.turn === 'w' ? 'Trắng' : 'Đen';

    if (!hasLegal) {
      if (inCheck) {
        playTone('success');
        setStatus(`🏆 CHIẾU HẾT (Checkmate)! Bên ${state.turn === 'w' ? 'Đen' : 'Trắng'} giành chiến thắng!`, 'success');
      } else {
        setStatus(`🤝 HÒA PAT (Stalemate)! Bên ${side} hết nước đi nhưng không bị chiếu.`, 'info');
      }
    } else if (inCheck) {
      setStatus(`⚠️ CHIẾU VUA! Bên ${side} đang bị chiếu.`, 'error');
    } else {
      setStatus(`Đến lượt bên ${side}.`, 'info');
    }
    updateTurnBadge();
    renderBoard();
  }

  // =========================================================================
  // 9. BOARD CLICK / TAP INTERACTION HANDLER
  // =========================================================================
  function getCellFromPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const m = getBoardMetrics();
    const x = (e.clientX - rect.left) * (m.w / rect.width);
    const y = (e.clientY - rect.top) * (m.h / rect.height);

    let r, c;
    if (m.intersection) {
      c = Math.round((x - m.ox) / m.cell);
      r = Math.round((y - m.oy) / m.cell);
    } else {
      c = Math.floor((x - m.ox) / m.cell);
      r = Math.floor((y - m.oy) / m.cell);
    }
    if (r < 0 || r >= m.rows || c < 0 || c >= m.cols) return null;
    return [r, c];
  }

  function handleGoBoardTap(r, c, onConfirm) {
    if (state.goConfirmMode && !state.board[r][c]) {
      if (!state.goPreview || state.goPreview[0] !== r || state.goPreview[1] !== c) {
        state.goPreview = [r, c];
        playTone('move');
        setStatus(`🎯 Đang nhắm ô ${goCoordLabel(r, c)} — chạm lại vào ô đó để đặt quân!`, 'info');
        renderBoard();
        return;
      }
    }
    state.goPreview = null;
    onConfirm();
  }

  function handleBoardTap(r, c) {
    // 1. CURRICULUM MODE
    if (state.mode === 'curriculum') {
      if (state.game === 'go') {
        if (state.board[r][c]) {
          const grp = goGetGroup(state.board, r, c);
          state.highlights = Array.from(grp.liberties).map(s => s.split(',').map(Number));
          const colName = state.board[r][c] === 'B' ? 'Đen' : 'Trắng';
          playTone('move');
          setStatus(`Đám quân ${colName} gồm ${grp.stones.length} quân, hiện có ${grp.liberties.size} khí${grp.liberties.size === 1 ? ' (Atari!)' : ''}.`, 'info');
          renderBoard();
        }
        return;
      }
      if (state.board[r][c]) {
        state.selected = [r, c];
        state.legalMoves = state.game === 'xiangqi' ? xqLegalMoves(state.board, r, c) : chessLegalMoves(state.board, r, c);
        playTone('move');
        setStatus(`Đã chọn quân — có ${state.legalMoves.length} nước đi hợp lệ (chấm xanh).`, 'info');
        renderBoard();
      }
      return;
    }

    // 2. PIECES DEMO MODE
    if (state.mode === 'pieces') {
      if (state.game === 'go') {
        handleGoBoardTap(r, c, () => {
          const res = goTryPlace(state.board, r, c, state.turn);
          if (!res.ok) {
            playTone('error');
            setStatus(res.reason, 'error');
          } else {
            state.board = res.board;
            state.lastMove = { to: [r, c] };
            state.turn = state.turn === 'B' ? 'W' : 'B';
            playTone(res.captured > 0 ? 'capture' : 'move');
            setStatus(res.captured > 0
              ? `Ăn gọn ${res.captured} quân! Nhóm quân mới đặt còn ${res.liberties} khí.`
              : `Đặt quân thành công — nhóm này đang có ${res.liberties} khí.`, 'success');
            updateTurnBadge();
          }
          renderBoard();
        });
        return;
      }

      const activeItem = CONTENT[state.game].pieces[state.pieceIdx];
      const demoOpts = activeItem && activeItem.id === 'ch-castling'
        ? { castling: defaultCastling(), enPassant: null }
        : (activeItem && activeItem.id === 'ch-promo-ep' ? { castling: null, enPassant: [2, 3] } : null);

      if (state.selected && state.legalMoves.some(([mr, mc]) => mr === r && mc === c)) {
        const [sr, sc] = state.selected;
        const moving = state.board[sr][sc];
        let cap = !!state.board[r][c];
        let specialMsg = '';

        // Handle En Passant in demo
        if (state.game === 'chess' && moving === 'wP' && sc !== c && !state.board[r][c]) {
          state.board[sr][c] = null;
          cap = true;
          specialMsg = '⚡ Bắt tốt qua đường (En Passant) thành công!';
        }

        state.board[r][c] = moving;
        state.board[sr][sc] = null;

        // Handle Castling in demo
        if (state.game === 'chess' && moving === 'wK' && Math.abs(c - sc) === 2) {
          if (c === 6) { state.board[7][5] = 'wR'; state.board[7][7] = null; specialMsg = '🏰 Nhập thành cánh Vua (O-O) thành công!'; }
          else if (c === 2) { state.board[7][3] = 'wR'; state.board[7][0] = null; specialMsg = '🏰 Nhập thành cánh Hậu (O-O-O) thành công!'; }
        }

        // Handle Pawn promotion in demo
        if (state.game === 'chess' && moving[1] === 'P' && (r === 0 || r === 7)) {
          state.board[r][c] = moving[0] + 'Q';
          specialMsg = '👑 Phong cấp thành Hậu thành công!';
        }

        state.lastMove = { from: [sr, sc], to: [r, c] };
        state.selected = [r, c];
        state.legalMoves = state.game === 'xiangqi'
          ? xqLegalMoves(state.board, r, c)
          : chessLegalMoves(state.board, r, c);
        playTone(cap ? 'capture' : 'move');
        setStatus(specialMsg || (cap ? 'Ăn quân hợp lệ! Tiếp tục di chuyển hoặc nhấn Đặt lại.' : 'Di chuyển hợp lệ! Chấm xanh đã cập nhật theo vị trí mới.'), 'success');
        renderBoard();
      } else if (state.board[r][c]) {
        state.selected = [r, c];
        state.legalMoves = state.game === 'xiangqi'
          ? xqLegalMoves(state.board, r, c)
          : chessLegalMoves(state.board, r, c, demoOpts);
        renderBoard();
      }
      return;
    }

    // 3. PUZZLES MODE
    if (state.mode === 'puzzles') {
      const list = getFilteredPuzzles();
      const puz = list[state.puzzleIdx];
      if (!puz || puz.kind === 'formation') {
        showToast('Nhấn "Tiếp ➡️" hoặc "▶️ Tự động" để xem bố cục khai cuộc!');
        return;
      }
      if (state.puzzleBusy) return;
      if (state.puzzleSolvedNow) {
        showToast('Thế cờ đã hoàn thành! Hãy bấm "▶" hoặc "🔄 Làm lại".');
        return;
      }

      const expected = puz.solution[state.puzzleStep];

      if (state.game === 'go') {
        handleGoBoardTap(r, c, () => {
          if (r === expected.to[0] && c === expected.to[1]) {
            executePuzzleMove(puz, expected, false);
            state.puzzleStep++;
            if (state.puzzleStep >= puz.solution.length) {
              state.puzzleSolvedNow = true;
              saveSolved(puz.id);
              playTone('success');
              showToast('🎉 Xuất sắc! Bạn đã phá giải thành công!');
              const itemEl = rightPanelEl.querySelector(`#puzzleList .list-item[data-idx="${state.puzzleIdx}"] .list-item-title`);
              if (itemEl && !itemEl.textContent.startsWith('✅')) itemEl.textContent = '✅ ' + itemEl.textContent;
            }
          } else {
            playTone('error');
            setStatus('Chưa đúng điểm huyệt tối ưu! Hãy thử lại hoặc bấm "💡 Gợi ý".', 'error');
            renderBoard();
          }
        });
        return;
      }

      if (state.selected && state.legalMoves.some(([mr, mc]) => mr === r && mc === c)) {
        const [sr, sc] = state.selected;
        if (sr === expected.from[0] && sc === expected.from[1] && r === expected.to[0] && c === expected.to[1]) {
          executePuzzleMove(puz, expected, false);
          state.puzzleStep++;
          if (state.puzzleStep >= puz.solution.length) {
            state.puzzleSolvedNow = true;
            saveSolved(puz.id);
            playTone('success');
            showToast('🎉 Tuyệt vời! Bạn đã giải đúng thế cờ!');
            const itemEl = rightPanelEl.querySelector(`#puzzleList .list-item[data-idx="${state.puzzleIdx}"] .list-item-title`);
            if (itemEl && !itemEl.textContent.startsWith('✅')) itemEl.textContent = '✅ ' + itemEl.textContent;
          }
        } else {
          playTone('error');
          setStatus('Nước đi đó chưa tạo sát cục tối ưu! Hãy thử nước khác hoặc bấm "💡 Gợi ý".', 'error');
          state.selected = null;
          state.legalMoves = [];
          renderBoard();
        }
        return;
      }

      const piece = state.board[r][c];
      if (piece && piece[0] === puz.turn) {
        state.selected = [r, c];
        state.legalMoves = state.game === 'xiangqi' ? xqLegalMoves(state.board, r, c) : chessLegalMoves(state.board, r, c);
        renderBoard();
      }
      return;
    }

    // 4. SANDBOX MODE
    if (state.mode === 'sandbox') {
      if (state.sandboxTool === 'place') {
        if (state.game === 'go') {
          handleGoBoardTap(r, c, () => {
            pushSandboxHistory();
            state.board[r][c] = state.sandboxPiece;
            playTone('move');
            renderBoard();
          });
          return;
        }
        pushSandboxHistory();
        state.board[r][c] = state.sandboxPiece;
        playTone('move');
        renderBoard();
        return;
      }
      if (state.sandboxTool === 'erase') {
        if (state.board[r][c]) {
          pushSandboxHistory();
          state.board[r][c] = null;
          playTone('capture');
          renderBoard();
        }
        return;
      }

      if (state.game === 'go') {
        handleGoBoardTap(r, c, () => {
          const beforeHash = goBoardHash(state.board);
          const res = goTryPlace(state.board, r, c, state.turn, state.prevGoHash);
          if (!res.ok) {
            playTone('error');
            setStatus(res.reason, 'error');
            renderBoard();
          } else {
            pushSandboxHistory();
            state.prevGoHash = res.captured === 1 ? beforeHash : null;
            state.board = res.board;
            if (res.captured > 0) state.capturedGo[state.turn] += res.captured;
            state.lastMove = { to: [r, c] };
            state.turn = state.turn === 'B' ? 'W' : 'B';
            playTone(res.captured > 0 ? 'capture' : 'move');
            setStatus(res.captured > 0
              ? `Ăn được ${res.captured} quân đối phương!`
              : `Nước đi hợp lệ (${res.liberties} khí).`, 'info');
            updateTurnBadge();
            renderSandboxPanel();
            renderBoard();
          }
        });
        return;
      }

      if (state.selected && state.legalMoves.some(([mr, mc]) => mr === r && mc === c)) {
        pushSandboxHistory();
        const [sr, sc] = state.selected;
        const moving = state.board[sr][sc];
        let cap = !!state.board[r][c];

        if (state.game === 'chess') {
          if (moving[1] === 'P' && sc !== c && !state.board[r][c]) {
            state.board[sr][c] = null;
            cap = true;
          }
          if (moving[1] === 'K' && Math.abs(c - sc) === 2) {
            if (c === 6) { state.board[r][5] = moving[0] + 'R'; state.board[r][7] = null; }
            else if (c === 2) { state.board[r][3] = moving[0] + 'R'; state.board[r][0] = null; }
          }
          if (moving === 'wK') { state.castling.wK = false; state.castling.wQ = false; }
          if (moving === 'bK') { state.castling.bK = false; state.castling.bQ = false; }
          if (moving === 'wR' && sr === 7 && sc === 7) state.castling.wK = false;
          if (moving === 'wR' && sr === 7 && sc === 0) state.castling.wQ = false;
          if (moving === 'bR' && sr === 0 && sc === 7) state.castling.bK = false;
          if (moving === 'bR' && sr === 0 && sc === 0) state.castling.bQ = false;
          if (r === 7 && c === 7) state.castling.wK = false;
          if (r === 7 && c === 0) state.castling.wQ = false;
          if (r === 0 && c === 7) state.castling.bK = false;
          if (r === 0 && c === 0) state.castling.bQ = false;

          if (moving[1] === 'P' && Math.abs(r - sr) === 2) {
            state.enPassant = [(r + sr) / 2, c];
          } else {
            state.enPassant = null;
          }
        }

        state.board[r][c] = moving;
        state.board[sr][sc] = null;
        state.lastMove = { from: [sr, sc], to: [r, c] };
        state.selected = null;
        state.legalMoves = [];
        playTone(cap ? 'capture' : 'move');

        if (state.game === 'chess') {
          if (moving[1] === 'P' && (r === 0 || r === 7)) {
            renderBoard();
            openChessPromoModal(moving[0], r, c);
            return;
          }
          finishChessSandboxTurn();
          return;
        }

        state.turn = state.turn === 'r' ? 'b' : 'r';
        const inCheck = xqInCheck(state.board, state.turn);
        const hasLegal = xqHasAnyLegal(state.board, state.turn);
        const side = state.turn === 'r' ? 'Đỏ' : 'Đen';
        if (!hasLegal) {
          playTone('success');
          setStatus(`🏆 ${inCheck ? 'CHIẾU BÍ' : 'HẾT NƯỚC ĐI'}! Bên ${state.turn === 'r' ? 'Đen' : 'Đỏ'} giành thắng lợi!`, 'success');
        } else if (inCheck) {
          setStatus(`⚠️ CHIẾU TƯỚNG! Bên ${side} đang bị chiếu.`, 'error');
        } else {
          setStatus(`Đến lượt bên ${side}.`, 'info');
        }
        updateTurnBadge();
        renderBoard();
      } else if (state.board[r][c] && state.board[r][c][0] === state.turn) {
        state.selected = [r, c];
        const opts = state.game === 'chess' ? { castling: state.castling, enPassant: state.enPassant } : null;
        state.legalMoves = state.game === 'xiangqi' ? xqLegalMoves(state.board, r, c) : chessLegalMoves(state.board, r, c, opts);
        renderBoard();
      }
    }
  }

  canvas.addEventListener('click', (e) => {
    const pos = getCellFromPointer(e);
    if (!pos) return;
    handleBoardTap(pos[0], pos[1]);
  });

  // =========================================================================
  // 10. TOP NAVIGATION, BOTTOM MOBILE NAV, THEME & SOUND EVENTS
  // =========================================================================
  function switchGame(newGame) {
    state.game = newGame;
    state.lessonIdx = 0;
    state.pieceIdx = 0;
    state.puzzleIdx = 0;
    state.typeFilter = 'all';
    state.diffFilter = 'all';
    document.querySelectorAll('.game-tab').forEach(b => b.classList.toggle('active', b.dataset.game === newGame));
    loadCurrentView();
  }

  function switchMode(newMode) {
    state.mode = newMode;
    document.querySelectorAll('.mode-pill, .mob-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === newMode));
    loadCurrentView();
  }

  document.querySelectorAll('.game-tab').forEach(btn => {
    btn.addEventListener('click', () => switchGame(btn.dataset.game));
  });

  document.querySelectorAll('.mode-pill, .mob-nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  function syncTopControlsUI() {
    document.body.classList.toggle('dark', state.dark);
    document.getElementById('btnSound').innerHTML = soundEnabled
      ? '🔊 <span class="btn-label">Âm thanh</span>'
      : '🔇 <span class="btn-label">Tắt tiếng</span>';
    document.getElementById('btnTheme').innerHTML = state.dark
      ? '☀️ <span class="btn-label">Sáng</span>'
      : '🌙 <span class="btn-label">Tối</span>';
  }

  document.getElementById('btnSound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    savePrefs();
    syncTopControlsUI();
    if (soundEnabled) playTone('move');
  });

  document.getElementById('btnTheme').addEventListener('click', () => {
    state.dark = !state.dark;
    savePrefs();
    syncTopControlsUI();
  });

  window.addEventListener('resize', () => {
    resizeCanvasForGame();
    renderBoard();
  });

  window.addEventListener('load', () => {
    syncTopControlsUI();
    updateProgressUI();
    loadCurrentView();
  });
})();
</script>
</body>
