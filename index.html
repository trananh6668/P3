<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Tướng</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --panel-bg: #262635;
            --wood-light: #e9c496;
            --wood-dark: #c48b54;
            --wood-border: #4a2f1d;
            --line-color: #5c3a21;
            --red-text: #b32a1e;
            --black-text: #111820;
            --highlight: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            gap: 30px;
            background: linear-gradient(145deg, #2b2b3c, #1f1f2b);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.05);
            max-width: 1100px;
            height: 690px; 
            width: 100%;
        }

        .board-wrapper {
            position: relative;
            width: 540px;
            height: 600px;
            box-sizing: content-box; 
            background: linear-gradient(135deg, var(--wood-light) 0%, var(--wood-dark) 100%);
            border: 15px solid var(--wood-border);
            border-radius: 8px;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.7), 
                inset 0 0 40px rgba(139, 69, 19, 0.4),
                inset 0 0 5px rgba(0,0,0,0.5);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .board-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: block;
        }

        .river-text {
            position: absolute;
            top: 300px;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 32px;
            font-weight: 900;
            color: var(--line-color);
            font-family: "KaiTi", "STKaiti", serif;
            opacity: 0.85;
            pointer-events: none;
            letter-spacing: 20px;
        }

        .click-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        .cell {
            position: absolute;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .piece {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            font-family: "KaiTi", "STKaiti", serif;
            background: radial-gradient(circle at 35% 35%, #fffdfa 0%, #ecd8b1 50%, #c19c67 100%);
            border: 2px solid #7a4f25;
            box-shadow: 
                3px 5px 8px rgba(0,0,0,0.5), 
                inset -2px -4px 5px rgba(0,0,0,0.2), 
                inset 2px 2px 4px rgba(255,255,255,0.9);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: left, top, transform, opacity;
            z-index: 15;
            pointer-events: none;
        }

        .piece.red { color: var(--red-text); text-shadow: 1px 1px 0 rgba(255,255,255,0.5), 0 0 2px rgba(179, 42, 30, 0.3); }
        .piece.black { color: var(--black-text); text-shadow: 1px 1px 0 rgba(255,255,255,0.3); }
        .piece.selected { box-shadow: 0 0 20px #f1c40f, inset 0 0 10px rgba(241, 196, 15, 0.5); transform: scale(1.15); z-index: 25; border-color: #f1c40f; }
        .piece.target-dim { opacity: 0.4; filter: grayscale(60%); }

        .move-dot {
            width: 18px; height: 18px;
            background-color: var(--highlight);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--highlight);
            z-index: 20;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.7); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.7); opacity: 0.6; }
        }

        .sidebar {
            flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 320px;
        }

        .settings-panel {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #363645;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .selector-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            gap: 10px;
        }

        .selector-row label { 
            font-size: 13px; 
            font-weight: bold; 
            color: #ccc; 
            flex: 1;
        }
        
        .selector-row select {
            background: #1a1a24; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 7px 10px;
            border-radius: 4px; 
            outline: none; 
            cursor: pointer; 
            font-size: 13.5px; 
            font-weight: bold;
            flex: 0 0 60%;
            max-width: 200px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .selector-row select:focus { 
            border-color: #2ecc71; 
            box-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
        }

        .status-card, .captured-section, .log-section {
            background: var(--panel-bg); border-radius: 10px; border: 1px solid #363645;
        }

        .status-card { padding: 12px; text-align: center; }
        .status-title { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .status-value { font-size: 20px; font-weight: bold; transition: color 0.3s; }

        .captured-section { padding: 10px; }
        .captured-title { font-size: 11px; color: #999; margin-bottom: 8px; }
        .captured-box { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
        .captured-box .piece {
            position: relative !important; left: 0 !important; top: 0 !important;
            width: 32px; height: 32px; font-size: 18px;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.4); border-width: 1px;
            transform: scale(1) !important; opacity: 1 !important;
        }

        .log-section { flex: 1; display: flex; flex-direction: column; padding: 12px; min-height: 0; }
        .log-title { font-size: 11px; color: #999; margin-bottom: 8px; }
        .log-list {
            flex: 1; overflow-y: auto; background: #1a1a24; padding: 8px;
            border-radius: 6px; font-family: monospace; font-size: 13px; color: #ddd;
        }

        .log-item { border-bottom: 1px solid #2b2b36; padding: 4px 0; }
        .log-item span.red { color: #e74c3c; font-weight: bold; }
        .log-item span.black { color: #85c1e9; font-weight: bold; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .btn-reset {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 15px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-reset:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4); }
        .btn-reset:active { transform: translateY(1px); }

        @media (max-width: 900px) {
            body { padding: 10px; align-items: flex-start; }
            .game-container {
                flex-direction: column; align-items: center;
                padding: 15px; height: auto; gap: 15px;
            }
            .board-wrapper {
                transform: scale(0.65);
                transform-origin: top center;
                margin-bottom: -210px; 
            }
            .sidebar { width: 100%; min-width: unset; }
            .log-section { min-height: 150px; }
        }
        
        @media (max-width: 400px) {
            .board-wrapper {
                transform: scale(0.55);
                margin-bottom: -270px; 
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="board-wrapper" id="board-wrapper">
        <svg class="board-svg" viewBox="0 0 540 600">
            <g stroke="var(--line-color)" stroke-width="2" opacity="0.8">
                <line x1="30" y1="30" x2="30" y2="570"/>
                <line x1="90" y1="30" x2="90" y2="270"/> <line x1="90" y1="330" x2="90" y2="570"/>
                <line x1="150" y1="30" x2="150" y2="270"/> <line x1="150" y1="330" x2="150" y2="570"/>
                <line x1="210" y1="30" x2="210" y2="270"/> <line x1="210" y1="330" x2="210" y2="570"/>
                <line x1="270" y1="30" x2="270" y2="270"/> <line x1="270" y1="330" x2="270" y2="570"/>
                <line x1="330" y1="30" x2="330" y2="270"/> <line x1="330" y1="330" x2="330" y2="570"/>
                <line x1="390" y1="30" x2="390" y2="270"/> <line x1="390" y1="330" x2="390" y2="570"/>
                <line x1="450" y1="30" x2="450" y2="270"/> <line x1="450" y1="330" x2="450" y2="570"/>
                <line x1="510" y1="30" x2="510" y2="570"/>

                <line x1="30" y1="30" x2="510" y2="30"/>
                <line x1="30" y1="90" x2="510" y2="90"/>
                <line x1="30" y1="150" x2="510" y2="150"/>
                <line x1="30" y1="210" x2="510" y2="210"/>
                <line x1="30" y1="270" x2="510" y2="270"/>
                <line x1="30" y1="330" x2="510" y2="330"/>
                <line x1="30" y1="390" x2="510" y2="390"/>
                <line x1="30" y1="450" x2="510" y2="450"/>
                <line x1="30" y1="510" x2="510" y2="510"/>
                <line x1="30" y1="570" x2="510" y2="570"/>

                <line x1="210" y1="30" x2="330" y2="150"/>
                <line x1="330" y1="30" x2="210" y2="150"/>
                <line x1="210" y1="450" x2="330" y2="570"/>
                <line x1="330" y1="450" x2="210" y2="570"/>
            </g>
        </svg>
        <div class="river-text"><span>楚河</span><span>漢界</span></div>
        <div class="click-layer" id="click-layer"></div>
    </div>

    <div class="sidebar">
        <div class="settings-panel">
            <div class="selector-row">
                <label>Chế độ:</label>
                <select id="game-mode" onchange="toggleAiSettings(); initGame();">
                    <option value="ai">Đánh với Máy (AI)</option>
                    <option value="pvp">Hai người (Chung máy)</option>
                </select>
            </div>
            <div class="selector-row">
                <label>Phe của bạn:</label>
                <select id="player-side" onchange="initGame()">
                    <option value="r">Đỏ (Đi trước)</option>
                    <option value="b">Đen (Đi sau)</option>
                </select>
            </div>
            <div class="selector-row" id="ai-difficulty-row">
                <label>Độ Khó AI:</label>
                <select id="difficulty" onchange="updateDifficulty()">
                    <option value="easy">Dễ (Mới chơi)</option>
                    <option value="medium" selected>Vừa (Nghiệp dư)</option>
                    <option value="hard">Khó (Cao thủ)</option>
                </select>
            </div>
        </div>

        <div class="status-card">
            <div class="status-title">TRẠNG THÁI TRẬN ĐẤU</div>
            <div class="status-value" id="turn-status" style="color:#2ecc71;">Đỏ (Bạn đi)</div>
        </div>

        <div class="captured-section">
            <div class="captured-title">BÊN ĐỎ ĐÃ BỊ ĂN:</div>
            <div class="captured-box" id="captured-red"></div>
        </div>
        <div class="captured-section">
            <div class="captured-title">BÊN ĐEN ĐÃ BỊ ĂN:</div>
            <div class="captured-box" id="captured-black"></div>
        </div>

        <div class="log-section">
            <div class="log-title">LỊCH SỬ NƯỚC ĐI</div>
            <div class="log-list" id="log-list"></div>
        </div>

        <button class="btn-reset" onclick="initGame()">TẠO VÁN MỚI</button>
    </div>
</div>

<script>
const BOARD_SPECS = { offset: 30, spacing: 60, pieceSize: 50 };
const COLS = 9, ROWS = 10;
const RED = 'r', BLACK = 'b';

let AI_MAX_TIME = 2500;
let AI_MAX_DEPTH = 4;

const TEXTS = {
    'k': { 'r': '帥', 'b': '將' }, 'a': { 'r': '仕', 'b': '士' },
    'e': { 'r': '相', 'b': '象' }, 'h': { 'r': '傌', 'b': '馬' },
    'r': { 'r': '俥', 'b': '車' }, 'c': { 'r': '砲', 'b': '砲' },
    'p': { 'r': '兵', 'b': '卒' }
};
const VI_NAMES = { 'k': 'Tướng', 'a': 'Sĩ', 'e': 'Tượng', 'h': 'Mã', 'r': 'Xe', 'c': 'Pháo', 'p': 'Tốt' };
const PIECE_VALUES = { 'k': 100000, 'r': 900, 'c': 450, 'h': 400, 'a': 200, 'e': 200, 'p': 100 };

const initialBoard = [
    ['b_r','b_h','b_e','b_a','b_k','b_a','b_e','b_h','b_r'],
    [null ,null ,null ,null ,null ,null ,null ,null ,null ],
    [null ,'b_c',null ,null ,null ,null ,null ,'b_c',null ],
    ['b_p',null ,'b_p',null ,'b_p',null ,'b_p',null ,'b_p'],
    [null ,null ,null ,null ,null ,null ,null ,null ,null ],
    [null ,null ,null ,null ,null ,null ,null ,null ,null ],
    ['r_p',null ,'r_p',null ,'r_p',null ,'r_p',null ,'r_p'],
    [null ,'r_c',null ,null ,null ,null ,null ,'r_c',null ],
    [null ,null ,null ,null ,null ,null ,null ,null ,null ],
    ['r_r','r_h','r_e','r_a','r_k','r_a','r_e','r_h','r_r']
];

let board = [], turn = RED, selectedCell = null, validMoves = [];
let pieceElements = {}, moveCount = 1, isAiThinking = false;
let searchTimeout = false;
let nodesSearched = 0;

let gameMode = 'ai';
let playerSide = RED;

function toggleAiSettings() {
    gameMode = document.getElementById('game-mode').value;
    document.getElementById('ai-difficulty-row').style.display = (gameMode === 'ai') ? 'flex' : 'none';
}

function updateDifficulty() {
    const level = document.getElementById('difficulty').value;
    if (level === 'easy') { AI_MAX_TIME = 1000; AI_MAX_DEPTH = 2; } 
    else if (level === 'medium') { AI_MAX_TIME = 2500; AI_MAX_DEPTH = 4; } 
    else { AI_MAX_TIME = 4800; AI_MAX_DEPTH = 6; }
}

function getBoardCoords(r, c) {
    const displayR = (playerSide === BLACK) ? (9 - r) : r;
    const displayC = (playerSide === BLACK) ? (8 - c) : c;
    return { 
        x: BOARD_SPECS.offset + (displayC * BOARD_SPECS.spacing), 
        y: BOARD_SPECS.offset + (displayR * BOARD_SPECS.spacing) 
    };
}

function initGame() {
    gameMode = document.getElementById('game-mode').value;
    playerSide = document.getElementById('player-side').value;
    updateDifficulty(); 
    
    board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    pieceElements = {};
    document.getElementById('board-wrapper').querySelectorAll('.piece').forEach(e => e.remove());
    document.getElementById('captured-red').innerHTML = '';
    document.getElementById('captured-black').innerHTML = '';
    document.getElementById('log-list').innerHTML = '';
    
    turn = RED; selectedCell = null; validMoves = []; moveCount = 1; isAiThinking = false;
    
    const clickLayer = document.getElementById('click-layer');
    clickLayer.innerHTML = '';

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const coords = getBoardCoords(r, c);
            cell.dataset.row = r; cell.dataset.col = c;
            
            cell.style.left = `${coords.x - BOARD_SPECS.spacing/2}px`;
            cell.style.top = `${coords.y - BOARD_SPECS.spacing/2}px`;
            cell.addEventListener('click', () => handleCellClick(r, c));
            clickLayer.appendChild(cell);

            if (initialBoard[r][c]) {
                const [color, type] = initialBoard[r][c].split('_');
                createPiece(r, c, color, type);
            }
        }
    }
    
    updateStatus();

    if (gameMode === 'ai' && turn !== playerSide) {
        isAiThinking = true;
        setTimeout(makeAiMove, 500);
    }
}

function createPiece(r, c, color, type) {
    const id = `piece_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
    const pieceObj = { id, color, type, r, c };
    board[r][c] = pieceObj;

    const el = document.createElement('div');
    el.className = `piece ${color === RED ? 'red' : 'black'}`;
    el.innerText = TEXTS[type][color];
    el.id = id;
    positionPieceEl(el, r, c);
    document.getElementById('board-wrapper').appendChild(el);
    pieceElements[id] = el;
}

function positionPieceEl(el, r, c) {
    const coords = getBoardCoords(r, c);
    el.style.left = `${coords.x - BOARD_SPECS.pieceSize/2}px`;
    el.style.top = `${coords.y - BOARD_SPECS.pieceSize/2}px`;
}

function handleCellClick(r, c) {
    if (isAiThinking) return;
    if (gameMode === 'ai' && turn !== playerSide) return;

    const clickedPiece = board[r][c];

    if (clickedPiece && clickedPiece.color === turn) {
        clearHighlights();
        selectedCell = { r, c };
        validMoves = getLegalMoves(r, c, board);
        highlightMoves();
        return;
    }

    if (selectedCell) {
        const move = validMoves.find(m => m.toR === r && m.toC === c);
        if (move) {
            executeMove(move);
            clearHighlights();
            selectedCell = null;
            
            if (gameMode === 'ai' && turn !== playerSide) {
                isAiThinking = true;
                setTimeout(makeAiMove, 300); 
            }
        } else {
            clearHighlights();
            selectedCell = null;
        }
    }
}

function highlightMoves() {
    const el = pieceElements[board[selectedCell.r][selectedCell.c].id];
    if (el) el.classList.add('selected');

    validMoves.forEach(m => {
        const cellEl = document.querySelector(`.cell[data-row="${m.toR}"][data-col="${m.toC}"]`);
        if (board[m.toR][m.toC]) {
            const enemyPiece = pieceElements[board[m.toR][m.toC].id];
            if (enemyPiece) enemyPiece.classList.add('target-dim');
        }
        const dot = document.createElement('div');
        dot.className = 'move-dot';
        cellEl.appendChild(dot);
    });
}

function clearHighlights() {
    document.querySelectorAll('.piece').forEach(p => p.classList.remove('selected', 'target-dim'));
    document.querySelectorAll('.move-dot').forEach(d => d.remove());
}

function executeMove(move) {
    const { fromR, fromC, toR, toC } = move;
    const piece = board[fromR][fromC];
    const target = board[toR][toC];

    if (target) {
        const targetEl = pieceElements[target.id];
        targetEl.style.transform = 'scale(0)';
        targetEl.style.opacity = '0';
        
        setTimeout(() => {
            targetEl.remove();
            addCapturedPiece(target);
        }, 250);
        
        delete pieceElements[target.id];
    }

    board[toR][toC] = piece;
    board[fromR][fromC] = null;
    piece.r = toR; piece.c = toC;

    positionPieceEl(pieceElements[piece.id], toR, toC);
    logMove(piece, fromR, fromC, toR, toC, !!target);

    turn = (turn === RED) ? BLACK : RED;
    updateStatus();
    
    if (target && target.type === 'k') {
        let winnerText = (piece.color === RED) ? 'ĐỎ CHIẾN THẮNG!' : 'ĐEN CHIẾN THẮNG!';
        if (gameMode === 'ai') {
            winnerText = (piece.color === playerSide) ? 'CHÚC MỪNG! BẠN ĐÃ CHIẾN THẮNG!' : 'MÁY TÍNH ĐÃ CHIẾN THẮNG!';
        }
        setTimeout(() => alert(winnerText), 300);
        isAiThinking = true;
    }
}

function addCapturedPiece(piece) {
    const container = document.getElementById(piece.color === RED ? 'captured-red' : 'captured-black');
    const div = document.createElement('div');
    div.className = `piece ${piece.color === RED ? 'red' : 'black'}`;
    div.innerText = TEXTS[piece.type][piece.color];
    container.appendChild(div);
}

function logMove(piece, fR, fC, tR, tC, isCapture) {
    const logList = document.getElementById('log-list');
    const item = document.createElement('div');
    item.className = 'log-item';
    
    const sideClass = piece.color === RED ? 'red' : 'black';
    let sideName = piece.color === RED ? 'Đỏ' : 'Đen';
    if (gameMode === 'ai') {
        sideName = piece.color === playerSide ? 'Bạn' : 'Máy';
    }
    
    const action = isCapture ? 'ăn quân tại' : 'di chuyển tới';
    item.innerHTML = `[<span class="${sideClass}">${sideName}</span>] ${VI_NAMES[piece.type]} (${fC},${9-fR}) ${action} (${tC},${9-tR})`;
    
    logList.appendChild(item);
    while (logList.children.length > 15) { logList.removeChild(logList.firstChild); }
    logList.scrollTop = logList.scrollHeight;
}

function updateStatus() {
    const statusEl = document.getElementById('turn-status');
    if (gameMode === 'pvp') {
        if (turn === RED) {
            statusEl.innerText = "Lượt của phe Đỏ";
            statusEl.style.color = "#e74c3c";
        } else {
            statusEl.innerText = "Lượt của phe Đen";
            statusEl.style.color = "#85c1e9";
        }
    } else {
        if (turn === playerSide) {
            statusEl.innerText = (playerSide === RED) ? "Đỏ (Lượt của Bạn)" : "Đen (Lượt của Bạn)";
            statusEl.style.color = "#2ecc71";
        } else {
            statusEl.innerText = (playerSide === RED) ? "Đen (Máy đang nghĩ...)" : "Đỏ (Máy đang nghĩ...)";
            statusEl.style.color = "#f1c40f";
        }
    }
}

function getLegalMoves(r, c, bState) {
    const piece = bState[r][c];
    if (!piece) return [];
    let rawMoves = [];
    const color = piece.color;

    switch (piece.type) {
        case 'k': 
            for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                let nr = r + dr, nc = c + dc;
                if (inPalace(nr, nc, color) && (!bState[nr][nc] || bState[nr][nc].color !== color)) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
            }
            break;
        case 'a': 
            for (let [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
                let nr = r + dr, nc = c + dc;
                if (inPalace(nr, nc, color) && (!bState[nr][nc] || bState[nr][nc].color !== color)) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
            }
            break;
        case 'e': 
            for (let [dr, dc] of [[-2,-2],[-2,2],[2,-2],[2,2]]) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if ((color === RED && nr >= 5) || (color === BLACK && nr <= 4)) {
                        if (!bState[r + dr/2][c + dc/2]) { 
                            if (!bState[nr][nc] || bState[nr][nc].color !== color) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
                        }
                    }
                }
            }
            break;
        case 'h': 
            const hDirs = [ { dr: -2, dc: -1, br: -1, bc: 0 }, { dr: -2, dc: 1, br: -1, bc: 0 }, { dr: 2, dc: -1, br: 1, bc: 0 }, { dr: 2, dc: 1, br: 1, bc: 0 }, { dr: -1, dc: -2, br: 0, bc: -1 }, { dr: 1, dc: -2, br: 0, bc: -1 }, { dr: -1, dc: 2, br: 0, bc: 1 }, { dr: 1, dc: 2, br: 0, bc: 1 } ];
            for (let d of hDirs) {
                let nr = r + d.dr, nc = c + d.dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (!bState[r + d.br][c + d.bc]) { 
                        if (!bState[nr][nc] || bState[nr][nc].color !== color) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
                    }
                }
            }
            break;
        case 'r': 
            for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (!bState[nr][nc]) { rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc}); } 
                    else {
                        if (bState[nr][nc].color !== color) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
                        break;
                    }
                    nr += dr; nc += dc;
                }
            }
            break;
        case 'c': 
            for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                let nr = r + dr, nc = c + dc;
                let jumped = false;
                while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (!bState[nr][nc]) {
                        if (!jumped) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
                    } else {
                        if (!jumped) { jumped = true; } 
                        else {
                            if (bState[nr][nc].color !== color) rawMoves.push({fromR:r, fromC:c, toR:nr, toC:nc});
                            break;
                        }
                    }
                    nr += dr; nc += dc;
                }
            }
            break;
        case 'p': 
            const dir = (color === RED) ? -1 : 1;
            if (r + dir >= 0 && r + dir < ROWS) {
                if (!bState[r + dir][c] || bState[r + dir][c].color !== color) {
                    rawMoves.push({fromR:r, fromC:c, toR:r + dir, toC:c});
                }
            }
            if ((color === RED && r <= 4) || (color === BLACK && r >= 5)) {
                for (let dc of [-1, 1]) {
                    if (c + dc >= 0 && c + dc < COLS) {
                        if (!bState[r][c + dc] || bState[r][c + dc].color !== color) {
                            rawMoves.push({fromR:r, fromC:c, toR:r, toC:c + dc});
                        }
                    }
                }
            }
            break;
    }
    return rawMoves;
}

function inPalace(r, c, color) {
    if (c < 3 || c > 5) return false;
    return color === RED ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
}

function evaluateBoard(bState) {
    let score = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const p = bState[r][c];
            if (p) {
                let val = PIECE_VALUES[p.type];
                if (p.type === 'p') {
                    if (p.color === BLACK && r >= 5) val += 30 + (r * 10);
                    if (p.color === RED && r <= 4) val += 30 + ((9 - r) * 10);
                }
                if (p.type === 'h') {
                    if (c > 1 && c < 7) val += 20; 
                    if (r > 2 && r < 7) val += 20; 
                }
                score += (p.color === BLACK) ? val : -val;
            }
        }
    }
    return score;
}

function getAllMoves(bState, color) {
    let moves = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (bState[r][c] && bState[r][c].color === color) {
                moves = moves.concat(getLegalMoves(r, c, bState));
            }
        }
    }
    moves.sort((a, b) => {
        const targetA = bState[a.toR][a.toC];
        const targetB = bState[b.toR][b.toC];
        const scoreA = targetA ? PIECE_VALUES[targetA.type] : 0;
        const scoreB = targetB ? PIECE_VALUES[targetB.type] : 0;
        return scoreB - scoreA;
    });
    return moves;
}

function minimax(bState, depth, alpha, beta, isMaximizing, startTime) {
    if (searchTimeout) return { timeout: true, score: 0 };
    
    if (++nodesSearched % 2000 === 0) {
        if (Date.now() - startTime > AI_MAX_TIME) {
            searchTimeout = true;
            return { timeout: true, score: 0 };
        }
    }

    if (depth === 0) return { score: evaluateBoard(bState) };

    const color = isMaximizing ? BLACK : RED;
    let moves = getAllMoves(bState, color);
    
    if (moves.length === 0) return { score: isMaximizing ? -999999 : 999999 };

    let bestMove = moves[0];

    if (isMaximizing) {
        let maxEval = -Infinity;
        for (let move of moves) {
            const captured = bState[move.toR][move.toC];
            const piece = bState[move.fromR][move.fromC];
            
            bState[move.toR][move.toC] = piece; bState[move.fromR][move.fromC] = null;
            let res = minimax(bState, depth - 1, alpha, beta, false, startTime);
            bState[move.fromR][move.fromC] = piece; bState[move.toR][move.toC] = captured;
            
            if (res.timeout) return { timeout: true, score: 0 }; 

            let evalScore = res.score;
            if (evalScore > maxEval) { maxEval = evalScore; bestMove = move; }
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break; 
        }
        return { score: maxEval, move: bestMove };
    } else {
        let minEval = Infinity;
        for (let move of moves) {
            const captured = bState[move.toR][move.toC];
            const piece = bState[move.fromR][move.fromC];
            
            bState[move.toR][move.toC] = piece; bState[move.fromR][move.fromC] = null;
            let res = minimax(bState, depth - 1, alpha, beta, true, startTime);
            bState[move.fromR][move.fromC] = piece; bState[move.toR][move.toC] = captured;
            
            if (res.timeout) return { timeout: true, score: 0 };

            let evalScore = res.score;
            if (evalScore < minEval) { minEval = evalScore; bestMove = move; }
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
        }
        return { score: minEval, move: bestMove };
    }
}

function makeAiMove() {
    let startTime = Date.now();
    let bestGlobalMove = null;
    searchTimeout = false;
    nodesSearched = 0;

    for (let d = 1; d <= AI_MAX_DEPTH; d++) {
        let result = minimax(board, d, -Infinity, Infinity, (turn === BLACK), startTime);
        
        if (result.timeout) break; 
        if (result.move) bestGlobalMove = result.move;
    }

    if (bestGlobalMove) {
        executeMove(bestGlobalMove);
    } else {
        alert("Máy không còn nước đi hợp lệ!");
    }
    isAiThinking = false;
}

window.onload = initGame;
</script>
