const tasks = ['Học HTML5 Semantic', 'Thực hành CSS Grid'];

// Truy xuất các phần tử DOM cần thiết
const taskForm = document.querySelector('#task-form');
const taskInput = document.querySelector('#task-input');
const taskList = document.querySelector('#task-list');

// Hàm render danh sách ra giao diện bằng Template Literals
const renderTasks = () => {
  taskList.innerHTML = tasks
    .map((task, index) => \`
      <li class="task-item">
        <span>\${task}</span>
        <button onclick="removeTask(\${index})">Xóa</button>
      </li>
    \`)
    .join('');
};

// Lắng nghe sự kiện submit form
taskForm.addEventListener('submit', (event) => {
  event.preventDefault(); // Ngăn trình duyệt reload trang
  const newTask = taskInput.value.trim();
  
  if (newTask !== '') {
    tasks.push(newTask);
    taskInput.value = '';
    renderTasks();
  }
});

// Hàm xóa công việc theo vị trí index
window.removeTask = (index) => {
  tasks.splice(index, 1);
  renderTasks();
};

renderTasks();`,

require_once 'config/database.php';

// 1. CREATE: Thêm học viên mới an toàn
function addStudent(PDO $pdo, string $name, string $email, string $course): int {
    $sql = "INSERT INTO students (name, email, course) VALUES (:name, :email, :course)";
    $stmt = $pdo->prepare($sql);
    $stmt->execute([
        'name'   => $name,
        'email'  => $email,
        'course' => $course
    ]);
    return (int) $pdo->lastInsertId();
}

// 2. READ: Lấy danh sách tất cả học viên
function getAllStudents(PDO $pdo): array {
    $stmt = $pdo->query("SELECT id, name, email, course FROM students ORDER BY id DESC");
    return $stmt->fetchAll();
}

// 3. UPDATE: Cập nhật khóa học theo ID
function updateStudentCourse(PDO $pdo, int $id, string $newCourse): bool {
    $sql = "UPDATE students SET course = :course WHERE id = :id";
    $stmt = $pdo->prepare($sql);
    return $stmt->execute(['course' => $newCourse, 'id' => $id]);
}

// 4. DELETE: Xóa học viên theo ID
function deleteStudent(PDO $pdo, int $id): bool {
    $sql = "DELETE FROM students WHERE id = :id";
    $stmt = $pdo->prepare($sql);
    return $stmt->execute(['id' => $id]);
}
?>`,

    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        info: 'bg-indigo-600 text-white border-indigo-500',
        error: 'bg-rose-600 text-white border-rose-500'
      };
      const icons = {
        success: 'fa-circle-check',
        info: 'fa-circle-info',
        error: 'fa-triangle-exclamation'
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (theme === 'dark') {
        html.classList.add('dark');
        if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        html.classList.remove('dark');
        if (icon) icon.className = 'fa-solid fa-moon text-slate-700';
      }
    }

      overlay.classList.toggle('hidden');
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Đã sao chép code vào bộ nhớ tạm!', 'success');
      } catch (err) {
        showToast('Không thể sao chép tự động.', 'error');

      document.body.removeChild(textarea);

        showToast('Chúc mừng! Bạn đã hoàn thành bài học này.', 'success');

      renderApp();

              <div class="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-medium flex items-center justify-between border-b border-slate-200 dark:border-slate-700">
                <span><i class="fa-solid fa-window-maximize mr-1.5 text-indigo-500"></i>Kết quả hiển thị trực tiếp (Preview)</span>
                <span class="text-[11px] text-slate-400">Viewport Responsive</span>
              </div>
              <iframe id="fe-sandbox-preview" class="flex-1 w-full bg-white border-0"></iframe>
            </div>
          </div>
        </div>
      `;

      const editor = document.getElementById('fe-sandbox-editor');
      editor.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          runFrontendSandbox();
        }
      });

      runFrontendSandbox();
    }

    function runFrontendSandbox() {
      const editor = document.getElementById('fe-sandbox-editor');
      const iframe = document.getElementById('fe-sandbox-preview');
      if (!editor || !iframe) return;
      iframe.srcdoc = editor.value;
    }

    function resetFrontendSandbox() {
      const lesson = getCurrentLesson();
      const editor = document.getElementById('fe-sandbox-editor');
      if (editor) {
        editor.value = lesson.sandbox.defaultCode;
        runFrontendSandbox();
        showToast('Đã khôi phục mã nguồn mẫu ban đầu.', 'info');
      }
    }

    // =========================================================================

                  </div>
                  <div>
                    <input type="email" id="sim-email" required placeholder="Email (VD: huy.dg@gmail.com)"

                  <p class="text-[11px] text-slate-500 dark:text-slate-400">Bấm nút dưới để gửi chuỗi độc hại <code>' OR '1'='1; DROP TABLE students;--</code> qua Prepared Statement:</p>

            <div class="lg:col-span-7 space-y-4">

              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">

              <!-- Terminal Log PHP Execution & JSON Response -->

                <div class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs font-mono text-slate-400">
                  <span><i class="fa-solid fa-terminal text-emerald-400 mr-1.5"></i>PHP Server Execution Log & JSON Output</span>
                  <span class="text-[11px] text-slate-500">HTTP/1.1 200 OK</span>
                </div>
                <pre id="php-sim-console" class="p-4 text-xs font-mono text-emerald-300 overflow-x-auto max-h-56 leading-relaxed whitespace-pre-wrap"></pre>

      renderMockMysqlTable();
      updatePhpConsole(
        `// Kết nối MySQL PDO thành công: mysql:host=127.0.0.1;dbname=fullstack_db;charset=utf8mb4\n` +
        `$stmt = $pdo->query("SELECT * FROM students ORDER BY id DESC");\n` +
        `// Trả về ${appState.mockDbStudents.length} bản ghi từ cơ sở dữ liệu.`
      );
    }

    function renderMockMysqlTable() {
      const tbody = document.getElementById('mock-mysql-tbody');
      const countEl = document.getElementById('db-row-count');
      if (!tbody) return;

      countEl.textContent = `${appState.mockDbStudents.length} rows`;

      if (appState.mockDbStudents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Bảng trống (0 bản ghi). Hãy thêm học viên mới ở cột bên trái!</td></tr>`;
        return;
      }

      tbody.innerHTML = appState.mockDbStudents.map(row => `
        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
          <td class="py-2.5 px-3 font-mono font-bold text-indigo-600 dark:text-indigo-400">#${row.id}</td>
          <td class="py-2.5 px-3 font-medium">${escapeHtml(row.name)}</td>
          <td class="py-2.5 px-3 text-slate-500 dark:text-slate-400">${escapeHtml(row.email)}</td>
          <td class="py-2.5 px-3">
            <span class="px-2 py-0.5 rounded-md bg-cyan-500/10 text-cyan-700 dark:text-cyan-300 font-medium">${escapeHtml(row.course)}</span>
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap space-x-1">
            <button onclick="handleSimUpdate(${row.id})" title="UPDATE course" class="px-2 py-1 rounded bg-amber-500/15 hover:bg-amber-500/25 text-amber-600 dark:text-amber-400 font-mono text-[11px] transition">UPDATE</button>
            <button onclick="handleSimDelete(${row.id})" title="DELETE row" class="px-2 py-1 rounded bg-rose-500/15 hover:bg-rose-500/25 text-rose-600 dark:text-rose-400 font-mono text-[11px] transition">DELETE</button>
          </td>
        </tr>
      `).join('');
    }

    function updatePhpConsole(text) {
      const el = document.getElementById('php-sim-console');
      if (el) el.textContent = text;
    }

    function handleSimInsert(e) {
      e.preventDefault();
      const nameInput = document.getElementById('sim-name');
      const emailInput = document.getElementById('sim-email');
      const courseInput = document.getElementById('sim-course');

      const nextId = appState.mockDbStudents.length > 0
        ? Math.max(...appState.mockDbStudents.map(s => s.id)) + 1
        : 1;

      const newRecord = {
        id: nextId,
        name: nameInput.value.trim(),
        email: emailInput.value.trim(),
        course: courseInput.value
      };

      appState.mockDbStudents.unshift(newRecord);
      saveState();
      renderMockMysqlTable();

      updatePhpConsole(
        `// [PHP PDO EXECUTED - HTTP 201 Created]\n` +
        `$sql = "INSERT INTO students (name, email, course) VALUES (:name, :email, :course)";\n` +
        `$stmt = $pdo->prepare($sql);\n` +
        `$stmt->execute(${JSON.stringify({ name: newRecord.name, email: newRecord.email, course: newRecord.course })});\n\n` +
        `// JSON Response trả về Frontend:\n` +
        JSON.stringify({ status: 'success', message: 'Thêm học viên thành công', id: nextId }, null, 2)
      );

      nameInput.value = '';
      emailInput.value = '';
      showToast(`Đã INSERT bản ghi #${nextId} vào MySQL!`, 'success');
    }

    function handleSimUpdate(id) {
      const student = appState.mockDbStudents.find(s => s.id === id);
      if (!student) return;
      const courses = ['Frontend HTML/CSS/JS', 'PHP & MySQL PDO', 'Fullstack Web Pro'];
      const nextCourse = courses[(courses.indexOf(student.course) + 1) % courses.length];
      student.course = nextCourse;

      saveState();
      renderMockMysqlTable();

      updatePhpConsole(
        `// [PHP PDO UPDATE EXECUTED]\n` +
        `$stmt = $pdo->prepare("UPDATE students SET course = :course WHERE id = :id");\n` +
        `$stmt->execute(['course' => '${nextCourse}', 'id' => ${id}]);\n` +
        `// Affected rows: 1`
      );
      showToast(`Đã UPDATE khóa học cho ID #${id}`, 'info');
    }

    function handleSimDelete(id) {
      appState.mockDbStudents = appState.mockDbStudents.filter(s => s.id !== id);
      saveState();
      renderMockMysqlTable();

      updatePhpConsole(
        `// [PHP PDO DELETE EXECUTED]\n` +
        `$stmt = $pdo->prepare("DELETE FROM students WHERE id = :id");\n` +
        `$stmt->execute(['id' => ${id}]);\n` +
        `// Bản ghi #${id} đã được xóa an toàn khỏi MySQL.`
      );
      showToast(`Đã DELETE bản ghi #${id} khỏi MySQL`, 'info');
    }

    function simulateSqlInjectionTest() {
      const payload = "' OR '1'='1; DROP TABLE students;--";
      updatePhpConsole(
        `// [BẢO MẬT SQL INJECTION TEST]\n` +
        `$maliciousInput = "${payload}";\n` +
        `$stmt = $pdo->prepare("SELECT * FROM students WHERE email = :email");\n` +
        `$stmt->execute(['email' => $maliciousInput]);\n\n` +
        `🛡️ KẾT QUẢ: Bị vô hiệu hóa hoàn toàn!\n` +
        `MySQL tìm kiếm chuỗi văn bản chính xác là "${payload}" và trả về 0 bản ghi. Bảng students vẫn an toàn 100%.`
      );
      showToast('Prepared Statement đã chặn đứng mã độc SQL Injection!', 'success');
    }

    function simulateApiGet() {
      const responsePayload = {
        status: 'success',
        count: appState.mockDbStudents.length,
        data: appState.mockDbStudents
      };
      updatePhpConsole(
        `// GET /api/students.php\n` +
        `// Header: Content-Type: application/json; charset=UTF-8\n\n` +
        JSON.stringify(responsePayload, null, 2)
      );
      showToast('Đã gọi API GET /api/students.php thành công!', 'success');
    }

    function resetMockDatabase() {
      appState.mockDbStudents = [
        { id: 1, name: 'Nguyễn Minh Tuấn', email: 'tuan.nm@gmail.com', course: 'Frontend HTML/CSS/JS' },
        { id: 2, name: 'Trần Thị Lan Anh', email: 'lananh.tran@yahoo.com', course: 'PHP & MySQL PDO' },
        { id: 3, name: 'Lê Hoàng Nam', email: 'nam.lh@fullstack.vn', course: 'Fullstack Web Pro' }
      ];
      saveState();
      renderMockMysqlTable();
      showToast('Đã khôi phục dữ liệu mẫu bảng students.', 'info');
    }

    // =========================================================================
    // 8. TAB 4: BÀI TẬP TRẮC NGHIỆM & CHẤM ĐIỂM TỰ ĐỘNG
    // =========================================================================
    function renderQuizTab(lesson, container) {
      const savedLessonAnswers = appState.quizAnswers[lesson.id] || {};
      const questions = lesson.quiz;

      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (savedLessonAnswers[idx] === q.answer) correctCount++;
      });

      container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-5">
          <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="font-bold text-base">Kiểm tra kiến thức: ${lesson.title}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Chọn đáp án đúng nhất cho từng câu hỏi bên dưới để nhận giải thích chi tiết.</p>
            </div>
            <div class="px-3.5 py-2 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-600 dark:text-indigo-400 font-bold text-xs sm:text-sm shrink-0">
              Điểm số: ${correctCount} / ${questions.length}
            </div>
          </div>

          <div class="space-y-4">
            ${questions.map((q, qIdx) => {
              const userChoice = savedLessonAnswers[qIdx];
              const hasAnswered = userChoice !== undefined;
              const isCorrect = userChoice === q.answer;

              return `
                <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                  <div class="font-semibold text-sm sm:text-base">
                    <span class="text-indigo-600 dark:text-indigo-400 font-bold mr-1.5">Câu ${qIdx + 1}:</span>${escapeHtml(q.q)}
                  </div>
                  <div class="space-y-2">
                    ${q.options.map((opt, optIdx) => {
                      let btnStyle = 'border-slate-200 dark:border-slate-700 hover:border-indigo-500 bg-slate-50/60 dark:bg-slate-800/50';
                      let iconHtml = `<span class="w-6 h-6 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center text-xs font-bold shrink-0">${String.fromCharCode(65 + optIdx)}</span>`;

                      if (hasAnswered) {
                        if (optIdx === q.answer) {
                          btnStyle = 'border-emerald-500 bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 font-semibold';
                          iconHtml = `<i class="fa-solid fa-circle-check text-emerald-500 text-lg shrink-0"></i>`;
                        } else if (optIdx === userChoice) {
                          btnStyle = 'border-rose-500 bg-rose-500/15 text-rose-700 dark:text-rose-300';
                          iconHtml = `<i class="fa-solid fa-circle-xmark text-rose-500 text-lg shrink-0"></i>`;
                        }
                      }

                      return `
                        <button onclick="selectQuizOption('${lesson.id}', ${qIdx}, ${optIdx})"
                          class="w-full text-left p-3 rounded-xl border text-xs sm:text-sm flex items-center gap-3 transition ${btnStyle}">
                          ${iconHtml}
                          <span>${escapeHtml(opt)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  ${hasAnswered ? `
                    <div class="p-3.5 rounded-xl text-xs leading-relaxed ${isCorrect ? 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-800 dark:text-amber-300 border border-amber-500/30'}">
                      <strong>${isCorrect ? '🎉 Chính xác!' : '💡 Giải thích:'}</strong> ${escapeHtml(q.explain)}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function selectQuizOption(lessonId, qIdx, optIdx) {
      if (!appState.quizAnswers[lessonId]) {
        appState.quizAnswers[lessonId] = {};
      }
      appState.quizAnswers[lessonId][qIdx] = optIdx;

      // Tự động đánh dấu hoàn thành bài nếu trả lời đúng hết câu hỏi
      const lesson = CURRICULUM.find(l => l.id === lessonId);
      if (lesson) {
        const allCorrect = lesson.quiz.every((q, i) => appState.quizAnswers[lessonId][i] === q.answer);
        if (allCorrect && !appState.completedLessons.includes(lessonId)) {
          appState.completedLessons.push(lessonId);
          showToast('Xuất sắc! Bạn đã vượt qua bài kiểm tra và hoàn thành bài học.', 'success');
        }
      }

      saveState();
      renderApp();
    }

    // Hàm escape HTML chống XSS khi render nội dung
    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // 9. KHỞI TẠO ỨNG DỤNG
    // =========================================================================
    function renderApp() {
      renderSidebar();
      renderHeaderAndFooter();
      renderTabs();
      renderMainContent();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
    });
  </script>
